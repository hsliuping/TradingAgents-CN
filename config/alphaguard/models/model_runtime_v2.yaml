schema_version: model_runtime_config_v2
runtime_version: alphaguard_model_runtime_v2
created_at: "2026-07-30T00:00:00+00:00"

budget_policy:
  policy_id: alphaguard_model_budget
  policy_version: v2
  max_calls_per_analysis: 10
  max_daily_calls: 100
  max_daily_cost: 20.0
  currency: USD

profiles:
  - profile_id: alphaguard_research_openai
    profile_version: v2
    role: RESEARCH_AGENT
    provider: openai
    model_name: gpt-4o-mini
    model_version:
    base_url: https://api.openai.com/v1
    structured_output_mode: NATIVE_SCHEMA
    temperature: 0.1
    max_input_tokens: 24000
    max_output_tokens: 3000
    timeout_seconds: 120
    max_retries: 1
    retry_backoff_seconds: 2
    credential_ref: keychain-alias:openai-primary
    prompt_profile_id: alphaguard_research_snapshot
    input_cost_per_million:
    output_cost_per_million:
    enabled: true
    production_allowed: true
    research_allowed: true

  - profile_id: alphaguard_normal_openai
    profile_version: v2
    role: NORMAL_TRADER
    provider: openai
    model_name: gpt-4o-mini
    model_version:
    base_url: https://api.openai.com/v1
    structured_output_mode: NATIVE_SCHEMA
    temperature: 0.2
    max_input_tokens: 24000
    max_output_tokens: 4000
    timeout_seconds: 180
    max_retries: 1
    retry_backoff_seconds: 2
    credential_ref: keychain-alias:openai-primary
    prompt_profile_id: normal_trade_plan_prompt
    input_cost_per_million:
    output_cost_per_million:
    enabled: true
    production_allowed: true
    research_allowed: true

  - profile_id: alphaguard_top_openai
    profile_version: v2
    role: TOP_RISK_REVIEWER
    provider: openai
    model_name: o4-mini
    model_version:
    base_url: https://api.openai.com/v1
    structured_output_mode: NATIVE_SCHEMA
    temperature: 0.1
    max_input_tokens: 24000
    max_output_tokens: 4000
    timeout_seconds: 180
    max_retries: 1
    retry_backoff_seconds: 2
    credential_ref: keychain-alias:openai-primary
    prompt_profile_id: top_risk_review_prompt
    input_cost_per_million:
    output_cost_per_million:
    enabled: true
    production_allowed: true
    research_allowed: true

prompts:
  - prompt_id: model_capability_prompt
    prompt_version: v1
    role: MODEL_CAPABILITY_CHECK
    schema_target: CapabilityEcho
    enabled: true
    template: |
      This is an AlphaGuard provider capability check. It cannot place trades.
      Return exactly {"status":"READY","note":"structured output available"}.

  - prompt_id: normal_trade_plan_capability_prompt
    prompt_version: v1
    role: MODEL_CAPABILITY_CHECK
    schema_target: NormalTradePlan
    enabled: true
    template: |
      This is a non-executable AlphaGuard NormalTradePlan capability check.
      Return exactly one synthetic NormalTradePlan matching the supplied schema.
      Use plan_id "capability-normal", snapshot_id "capability-snapshot",
      quant_proposal_id "capability-proposal", status "NO_TRADE", action "NONE",
      confidence 0, a non-empty thesis, empty evidence/condition/risk/question lists,
      null executable fields, revision_round 0, and omit model_meta because the
      runtime injects it. Do not propose a trade and do not use external data.

  - prompt_id: top_review_capability_prompt
    prompt_version: v2
    role: MODEL_CAPABILITY_CHECK
    schema_target: TopModelDecisionOutput
    enabled: true
    template: |
      This is a non-executable AlphaGuard TopModelDecisionOutput capability check.
      Return exactly one object matching the supplied schema. Use status "CONFIRM",
      scores between 0 and 1, empty missing_evidence, logical_conflicts,
      risk_findings and material_change_fields, proposed_changes {}, and a non-empty
      review_reason. Never output plan_id, supersedes_plan_id, snapshot_id,
      validation_run_id, review_id, or model_meta. Do not create or modify a trade.

  - prompt_id: alphaguard_research_snapshot
    prompt_version: v1
    role: RESEARCH_AGENT
    schema_target: ResearchAgentOutput
    enabled: true
    template: |
      You are the AlphaGuard {agent_role}. Use only the immutable Snapshot v2
      context below. Do not fetch current data, infer missing evidence, or issue
      orders. Return exactly one object matching the supplied JSON schema.
      Every conclusion must cite evidence_refs present in the context.

      Snapshot context:
      {context_json}

  - prompt_id: alphaguard_research_manager_snapshot
    prompt_version: v2
    role: RESEARCH_AGENT
    schema_target: ResearchManagerOutputV2
    enabled: true
    template: |
      You are the AlphaGuard RESEARCH_MANAGER. Synthesize the immutable,
      Snapshot-bound research results below. Do not fetch current data, infer
      missing evidence, make a BUY/SELL/HOLD decision, or create an order.

      The status field describes evidence completeness only. It must be exactly
      SUCCESS when the cited Snapshot evidence is sufficient for the synthesis,
      or INSUFFICIENT_DATA when it is not. Trading actions such as BUY, SELL,
      HOLD, WAIT, and NO_TRADE are never valid status values.

      Return exactly these five keys and no others: status, summary, findings,
      risks, evidence_refs. summary must be a non-empty string. findings, risks,
      and evidence_refs must be arrays of strings. Every evidence_refs value must
      be selected from the supplied immutable Snapshot evidence IDs. Return one
      JSON object matching the supplied schema without markdown or commentary.

      Snapshot context:
      {context_json}

      Prior research results:
      {research_json}

  - prompt_id: normal_trade_plan_prompt
    prompt_version: alphaguard-normal-quant-v1
    role: NORMAL_TRADER
    schema_target: NormalTradePlan
    enabled: true
    template: |
      You are AlphaGuard's Normal trader. Evaluate whether the existing
      QuantTradeProposal is supported by the immutable Snapshot v2 evidence.
      Do not discover a new opportunity, fetch current data, or invent missing
      values. Return exactly one NormalTradePlan matching the supplied schema.
      Data insufficiency must be explicit and non-executable.

      Snapshot-bound decision context:
      {context_json}

      TradingAgents research:
      {research_json}

  - prompt_id: top_risk_review_prompt
    prompt_version: alphaguard-top-review-v3
    role: TOP_RISK_REVIEWER
    schema_target: TopModelDecisionOutput
    enabled: true
    template: |
      You are AlphaGuard's Top risk reviewer. Review only the supplied Normal
      plan and immutable Snapshot v2 context. You may confirm, reduce risk,
      narrow conditions, reject, suspend, or request one material revision.
      Never reverse direction, increase position, loosen a stop, delete risk
      conditions, or create an order. Return exactly one TopModelDecisionOutput.
      plan_id, supersedes_plan_id, snapshot_id, validation_run_id, review_id,
      model_meta, and all other identity fields are server-owned. They may appear
      in the read-only context but must never appear in your output. Put every
      allowed Normal-plan edit in proposed_changes. When no edit is proposed,
      return proposed_changes as an empty object instead of copying the plan.
      CONFIRM, REJECT, and SUSPEND require proposed_changes {{}} and
      material_change_fields []. RISK_ADJUST requires non-empty proposed_changes
      and material_change_fields []. MATERIAL_REVISION requires non-empty
      proposed_changes and must list every materially changed field in
      material_change_fields.

      Snapshot-bound decision context:
      {context_json}

      Normal plan:
      {normal_plan_json}

      TradingAgents research:
      {research_json}

  - prompt_id: material_revision_prompt
    prompt_version: alphaguard-normal-revision-v1
    role: NORMAL_TRADER
    schema_target: NormalTradePlan
    enabled: true
    template: |
      Revise the supplied NormalTradePlan once, using only the immutable
      Snapshot v2 context and the Top review request. Do not reverse direction,
      expand risk, fetch current data, or invent evidence. Return exactly one
      revised NormalTradePlan. A second revision is forbidden.

      Snapshot-bound decision context:
      {context_json}

      Original plan:
      {normal_plan_json}

      Revision request:
      {revision_request_json}
