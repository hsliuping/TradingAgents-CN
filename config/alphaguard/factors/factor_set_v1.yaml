factor_set_version: factor-set-v1
schema_version: factor-config-v1
group_coverage_threshold: 0.60
factors:
  - {factor_id: close_vs_ma20_v1, factor_version: 1.0.0, name: Close versus MA20, group: TREND, formula: "close / MA20 - 1", inputs: [prices.close], lookback: 20, normalization: centered_linear, lower: -0.10, upper: 0.10}
  - {factor_id: close_vs_ma60_v1, factor_version: 1.0.0, name: Close versus MA60, group: TREND, formula: "close / MA60 - 1", inputs: [prices.close], lookback: 60, normalization: centered_linear, lower: -0.20, upper: 0.20}
  - {factor_id: ma20_vs_ma60_v1, factor_version: 1.0.0, name: MA20 versus MA60, group: TREND, formula: "MA20 / MA60 - 1", inputs: [prices.close], lookback: 60, normalization: centered_linear, lower: -0.15, upper: 0.15}
  - {factor_id: ma20_slope_5d_v1, factor_version: 1.0.0, name: MA20 five-session slope, group: TREND, formula: "MA20(t) / MA20(t-5) - 1", inputs: [prices.close], lookback: 25, normalization: centered_linear, lower: -0.08, upper: 0.08}
  - {factor_id: momentum_20d_v1, factor_version: 1.0.0, name: 20-session momentum, group: MOMENTUM, formula: "close(t) / close(t-20) - 1", inputs: [prices.close], lookback: 21, normalization: centered_linear, lower: -0.20, upper: 0.20}
  - {factor_id: momentum_60d_v1, factor_version: 1.0.0, name: 60-session momentum, group: MOMENTUM, formula: "close(t) / close(t-60) - 1", inputs: [prices.close], lookback: 61, normalization: centered_linear, lower: -0.35, upper: 0.35}
  - {factor_id: relative_strength_hs300_20d_v1, factor_version: 1.0.0, name: Relative strength versus HS300, group: MOMENTUM, formula: "stock return 20d - HS300 return 20d", inputs: [prices.close, benchmark_prices.close], lookback: 21, normalization: centered_linear, lower: -0.15, upper: 0.15}
  - {factor_id: volume_confirmation_20d_v1, factor_version: 1.0.0, name: Volume confirmation, group: MOMENTUM, formula: "current volume / prior 20-session median", inputs: [prices.volume], lookback: 21, normalization: linear, lower: 0.50, upper: 2.00}
  - {factor_id: revenue_yoy_v1, factor_version: 1.0.0, name: Revenue year-on-year, group: QUALITY, formula: "latest disclosed revenue / same period prior year - 1", inputs: [financials.revenue, financials.report_period, financials.announcement_date], lookback: 0, normalization: centered_linear, lower: -0.30, upper: 0.50}
  - {factor_id: adjusted_net_profit_yoy_v1, factor_version: 1.0.0, name: Adjusted net profit year-on-year, group: QUALITY, formula: "latest disclosed adjusted profit / same period prior year - 1", inputs: [financials.adjusted_net_profit, financials.report_period, financials.announcement_date], lookback: 0, normalization: centered_linear, lower: -0.50, upper: 0.80}
  - {factor_id: roe_v1, factor_version: 1.0.0, name: Return on equity, group: QUALITY, formula: "latest disclosed ROE", inputs: [financials.roe, financials.announcement_date], lookback: 0, normalization: linear, lower: 0.00, upper: 0.25}
  - {factor_id: operating_cashflow_to_profit_v1, factor_version: 1.0.0, name: Operating cash flow to profit, group: QUALITY, formula: "operating cash flow / net profit", inputs: [financials.n_cashflow_act, financials.net_income, financials.announcement_date], lookback: 0, normalization: linear, lower: 0.00, upper: 2.00}
  - {factor_id: pe_ttm_percentile_3y_v1, factor_version: 1.0.0, name: PE TTM three-year percentile, group: VALUATION, formula: "positive current PE percentile in own trailing history", inputs: [prices.pe_ttm], lookback: 756, normalization: inverse_percentile, lower: 0.00, upper: 100.00, min_samples: 60}
  - {factor_id: pb_percentile_3y_v1, factor_version: 1.0.0, name: PB three-year percentile, group: VALUATION, formula: "positive current PB percentile in own trailing history", inputs: [prices.pb], lookback: 756, normalization: inverse_percentile, lower: 0.00, upper: 100.00, min_samples: 60}
  - {factor_id: dividend_yield_v1, factor_version: 1.0.0, name: Dividend yield, group: VALUATION, formula: "latest snapshot-referenced trailing dividend yield", inputs: [prices.dv_ttm], lookback: 1, normalization: linear, lower: 0.00, upper: 0.06}
  - {factor_id: atr14_pct_v1, factor_version: 1.0.0, name: ATR14 percentage, group: VOLATILITY_RISK, formula: "ATR14 / close", inputs: [prices.high, prices.low, prices.close], lookback: 15, normalization: risk_linear, lower: 0.01, upper: 0.08}
  - {factor_id: volatility20_annualized_v1, factor_version: 1.0.0, name: Annualized 20-session volatility, group: VOLATILITY_RISK, formula: "std(20 daily returns) * sqrt(250)", inputs: [prices.close], lookback: 21, normalization: risk_linear, lower: 0.10, upper: 0.60}
  - {factor_id: average_amount20_v1, factor_version: 1.0.0, name: Average traded amount 20 sessions, group: LIQUIDITY, formula: "mean(amount, 20)", inputs: [prices.amount], lookback: 20, normalization: log_linear, lower: 10000000.00, upper: 1000000000.00}
  - {factor_id: turnover20_v1, factor_version: 1.0.0, name: Average turnover 20 sessions, group: LIQUIDITY, formula: "mean(turnover_rate, 20)", inputs: [prices.turnover_rate], lookback: 20, normalization: linear, lower: 0.20, upper: 5.00}
  - {factor_id: short_term_excess_return5_v1, factor_version: 1.0.0, name: Five-session excess return, group: VOLATILITY_RISK, formula: "stock return 5d - HS300 return 5d", inputs: [prices.close, benchmark_prices.close], lookback: 6, normalization: absolute_risk, lower: 0.00, upper: 0.15}
  - {factor_id: event_risk_v1, factor_version: 1.0.0, name: Structured event risk, group: EVENT_RISK, formula: "highest versioned structured or keyword risk level", inputs: [news, announcements], lookback: 0, normalization: risk_linear, lower: 0.00, upper: 100.00, rule_version: event-risk-rules-v1}
