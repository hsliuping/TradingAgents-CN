# TradingAgents-CN Pro - 开发环境 Docker Compose
# 仅包含 MongoDB 和 Redis，后端服务由 IDE 直接运行
#
# 用法:
#   bash scripts/release/dev-env.sh up 2.1    # 启动 v2.1 开发环境
#   bash scripts/release/dev-env.sh down 3.0  # 停止 v3.0 开发环境
#   bash scripts/release/dev-env.sh status     # 查看所有环境状态
#
# 通过 -p 指定项目名实现多版本隔离：
#   docker-compose -p ta-v210 -f docker-compose.dev.yml up -d
#   项目名会自动成为容器名和数据卷名的前缀

services:
  mongodb:
    # 8.0：与数据卷格式（WiredTiger format 14）及京东云生产环境对齐；
    # 降级到 7.0 以下会因索引格式版本过新 fatal 退出
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tradingagents123
      MONGO_INITDB_DATABASE: tradingagents
      TZ: "Asia/Shanghai"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server --appendonly yes --requirepass tradingagents123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tradingagents123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
