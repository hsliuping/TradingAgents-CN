# A股 MCP 服务独立部署 - 用于先单独测试，验证通过后再合并到主 docker-compose
# 使用: docker-compose -f docker-compose.a-share-mcp.yml up -d

services:
  a-share-mcp:
    build:
      context: .
      dockerfile: a-share-mcp/Dockerfile
    image: tradingagents-a-share-mcp:latest
    container_name: tradingagents-a-share-mcp
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      TZ: "Asia/Shanghai"
