# MCP Memory 独立部署 - 用于先单独测试，验证通过后再合并到主 docker-compose
# 使用: docker-compose -f docker-compose.mcp-memory.yml up -d

version: '3.8'

services:
  mcp-memory:
    build:
      context: .
      dockerfile: mcp-memory/Dockerfile
    image: tradingagents-mcp-memory:latest
    container_name: tradingagents-mcp-memory
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - mcp_memory_data:/data
    environment:
      TZ: "Asia/Shanghai"
      MEMORY_FILE_PATH: "/data/memory.jsonl"

volumes:
  mcp_memory_data:
    driver: local
