[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-cn-pro"
version = "4.0.0-beta.1"
description = "TradingAgents-CN Pro - Multi-agent stock analysis system with advanced features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 后端API框架和服务器
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",

    # 数据库和缓存
    "motor>=3.3.0",
    "pymongo>=4.0.0",
    "redis>=6.2.0",

    # 认证和安全
    "PyJWT>=2.0.0",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.0.0",  # Session 签名（SessionMiddleware 需要）

    # 任务调度和异步
    "apscheduler>=3.10.0",
    "aiofiles>=0.8.0",

    # HTTP客户端和SSE
    "httpx>=0.24.0",
    "sse-starlette>=1.0.0",
    "mcp>=1.12.0",
    "mem0ai>=1.0.7",
    "jinja2>=3.0.0",  # 模板引擎（邮件模板需要）

    # 日志处理
    "concurrent-log-handler>=0.9.24",  # Windows 友好的日志轮转处理器

    # 数据源和金融数据
    "akshare>=1.17.86",
    "baostock>=0.8.8",
    "eodhd>=1.0.32",
    "finnhub-python>=2.4.23",
    "tushare>=1.4.21",
    "yfinance>=0.2.63",
    "stockstats>=0.6.5",

    # AI和LLM
    "chromadb>=1.0.12",
    "dashscope>=1.20.0",
    "google-generativeai>=0.8.3",  # Google Gemini SDK
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.1.12",  # 修复 client_options 未定义错误
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-mongodb>=2.0.0",  # v4.0 断点续跑：工作流 MongoDBSaver（thread_id=分析运行ID）
    "openai>=1.0.0,<2.0.0",
    "qdrant-client>=1.7.0",  # 向量数据库客户端

    # 数据处理和分析
    "pandas>=2.3.0",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.0",  # 估值测算 Excel 交付物（A10-D1）

    # 网络爬虫和解析
    "curl-cffi>=0.6.0",  # 模拟真实浏览器TLS指纹，绕过反爬虫检测
    "feedparser>=6.0.11",
    "parsel>=1.10.0",
    "praw>=7.8.1",
    "requests>=2.32.4",

    # 文档和格式化
    "markdown>=3.4.0",
    "pypandoc>=1.11",
    "python-docx>=0.8.11",  # Word文档处理，用于修复文本方向
    "python-pptx>=1.0.0",  # PPT文档处理（个股资料上传文本提取）
    "pypdf>=6.0.0",  # PDF文本提取（个股资料上传/猪周期研报解析）
    "pdfkit>=1.0.0",  # PDF生成工具，需要wkhtmltopdf（外部工具）
    "weasyprint>=62.0",  # PDF生成工具（纯Python，推荐，无需外部工具）

    # 工具和辅助
    "psutil>=6.1.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rich>=14.0.0",
    "setuptools>=80.9.0",
    "toml>=0.10.2",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
]

[project.optional-dependencies]
qianfan = ["qianfan>=0.4.20"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tradingagents = "main:main"

[tool.setuptools.packages.find]
include = ["tradingagents*"]
exclude = ["tests*", "docs*", "scripts*", "data*", "logs*", "reports*", "results*", "eval_results*", "upstream_contribution*"]

# ==================== 日志治理机器强制（docs/05-design/v4.0/logging-governance.md §5.1）====================
# T20 = 禁止 print（日志统一 logging.getLogger(__name__)）；存量违规在 per-file-ignores 冻结，只减不增
[tool.ruff]
extend-exclude = [
    "tests", "scripts", "examples", "utils", "docs", "data", "logs", "env",
    "frontend", "migrations", "webroot", "results", "reports", "eval_results",
    "research", "copyright_*", "deploy-all-in-one",
]

[tool.ruff.lint]
select = ["T20"]

[tool.ruff.lint.per-file-ignores]
# —— CLI 终端输出例外（与 scripts/check_logging_violations.py CLI_OUTPUT_FILES 同步）——
"main.py" = ["T20"]        # 交互式 CLI 入口（tradingagents 命令）
"start_dev.py" = ["T20"]   # 开发环境启动脚本终端输出
"cli/main.py" = ["T20"]
"cli/utils.py" = ["T20"]
"cli/akshare_init.py" = ["T20"]
"cli/baostock_init.py" = ["T20"]
"cli/tushare_init.py" = ["T20"]
"core/pro/ingest/__main__.py" = ["T20"]
"core/pro/ingest/industries/pig/maintain.py" = ["T20"]
# —— 批次 2 登记的 CLI/终端预览输出（同上 CLI_OUTPUT_FILES）——
"core/pro/domain_models/pig_cycle/compare.py" = ["T20"]
"core/pro/domain_models/pig_cycle/constraint.py" = ["T20"]
"core/pro/domain_models/pig_cycle/curve.py" = ["T20"]
"core/pro/domain_models/pig_cycle/enterprise.py" = ["T20"]
"core/pro/domain_models/pig_cycle/profile.py" = ["T20"]
"core/pro/domain_models/pig_cycle/stress.py" = ["T20"]
"core/pro/domain_models/pig_cycle/validate.py" = ["T20"]
"core/pro/domain_models/pig_cycle/sync_profiles.py" = ["T20"]
"app/scripts/init_providers.py" = ["T20"]
"tradingagents/config/tushare_config.py" = ["T20"]
# —— 启动自举 fallback 输出（与 FALLBACK_PRINT_FILES 同步：logging 未就绪，改 logger 会失效）——
"app/__main__.py" = ["T20"]
"app/core/logging_config.py" = ["T20"]
