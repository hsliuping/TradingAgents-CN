# Redis 配置文件（单容器内部使用）
# 仅监听 127.0.0.1，外部访问通过 nginx 入口

# 网络
bind 127.0.0.1
port 6379
protected-mode yes

# 数据目录
dir /var/lib/redis
dbfilename dump.rdb

# 持久化（append-only file）
appendonly yes
appendfilename "appendonly.aof"

# 日志
loglevel notice
logfile /var/log/redis/redis.log

# 密码（通过环境变量 REDIS_PASSWORD 注入到配置文件）
# 这里不写死密码，由启动脚本处理

# Fork 关闭
daemonize no

# 进程管理
pidfile /var/run/redis.pid

# 客户端输出缓冲（Redis 7 格式：client-output-buffer-limit <class> <hard> <soft> <soft seconds>）
# normal 类型：发布订阅以外的客户端
client-output-buffer-limit normal 0 0 0
# replica 类型：副本
client-output-buffer-limit replica 256mb 64mb 60
# pubsub 类型：发布订阅
client-output-buffer-limit pubsub 32mb 8mb 60

# 最大客户端数
maxclients 1000

# 内存管理（单用户场景，限制 256MB）
maxmemory 256mb
maxmemory-policy allkeys-lru
