# Journal（YAML 格式嵌套 storage 节点）
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

# 日志
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

# 网络配置
net:
  bindIp: 127.0.0.1
  port: 27017

# 进程管理
processManagement:
  fork: false
  pidFilePath: /var/run/mongodb.pid

# 兼容性
setParameter:
  enableLocalhostAuthBypass: true
