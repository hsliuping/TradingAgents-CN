# Journal（YAML 格式嵌套 storage 节点）
# MongoDB 7.0+ WiredTiger 默认启用 journaling，无需显式配置
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

# 日志
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

# 网络配置
net:
  bindIp: 127.0.0.1
  port: 27017

# 进程管理
processManagement:
  fork: false
  pidFilePath: /var/run/mongodb.pid

# ------------------------------------------------------------------------------
# 安全配置（启用 RBAC 认证 + 副本集密钥）
# ------------------------------------------------------------------------------
# 与原项目多容器部署保持一致：使用 admin 账户 + 密码认证
# transitionToAuth 由启动命令控制（首次启动添加，重启后不再添加）
security:
  authorization: enabled
  keyFile: /etc/mongodb-keyfile

# 兼容性
setParameter:
  enableLocalhostAuthBypass: true
