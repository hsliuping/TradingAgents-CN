# TradingAgents-CN Pro Service
# 单 Pod 单容器，ClusterIP 或 LoadBalancer 服务

apiVersion: v1
kind: Service
metadata:
  name: tradingagents
  namespace: tradingagents
  labels:
    app: tradingagents-cn-pro
spec:
  type: ClusterIP  # 内部访问，Ingress 转发到 8082
  selector:
    app: tradingagents-cn-pro
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
  sessionAffinity: ClientIP   # WebSocket 需要会话保持
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Ingress（京东云 SLB 入口）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradingagents
  namespace: tradingagents
  annotations:
    # 京东云 SLB 注解
    # 注意：实际使用时请参考京东云 Ingress 文档
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
spec:
  ingressClassName: nginx
  rules:
  - host: tradingagents.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tradingagents
            port:
              number: 8082
