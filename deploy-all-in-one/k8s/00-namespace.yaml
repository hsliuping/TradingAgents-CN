# TradingAgents-CN Pro K8s 部署示例
# 单 Pod 单容器 + s6-overlay 统一管理
#
# 用法：
#   1. 创建命名空间：kubectl apply -f namespace.yaml
#   2. 创建 Secret：先 base64 编码敏感数据，然后 kubectl apply -f secret.yaml
#   3. 部署 PVC：kubectl apply -f pvc.yaml
#   4. 部署应用：kubectl apply -f deployment.yaml
#   5. 创建服务：kubectl apply -f service.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: tradingagents
  labels:
    app: tradingagents-cn-pro
    version: 3.0.0
