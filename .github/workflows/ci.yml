name: CI

on:
  push:
    branches:
      - main
      - v3.0
  pull_request:

permissions:
  contents: read

jobs:
  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装最小测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings python-multipart concurrent-log-handler pytest httpx

      - name: 运行后端 smoke 测试
        run: |
          pytest -q tests/config/test_settings.py tests/config/test_logging_config.py tests/middleware/test_trace_id.py

  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 前端 Lint
        run: npm run lint

      - name: 前端类型检查
        run: npm run type-check

      - name: 前端构建
        run: npm exec vite build