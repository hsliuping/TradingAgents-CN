name: CI

on:
  push:
    branches:
      - main
      - v3.0
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      USE_MONGODB_STORAGE: 'false'
      PYTHONUTF8: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Governance Smoke
        run: |
          mkdir -p artifacts
          python scripts/run_governance_validations.py --only agent_workshop_governance_l4_l6 --output artifacts/governance-smoke.json 2>&1 | tee artifacts/governance-smoke.log

      - name: 上传 governance smoke 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-smoke-log
          path: |
            artifacts/governance-smoke.log
            artifacts/governance-smoke.json

      - name: 运行后端测试（含覆盖率）
        run: |
          pytest -q --tb=short --co -q 2>/dev/null | head -20 || true
          pytest -q --tb=short \
            --cov=app --cov=core \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=10

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 前端 Lint
        run: npm run lint

      - name: 前端类型检查
        run: npm run type-check

      - name: 前端构建
        run: npm exec vite build