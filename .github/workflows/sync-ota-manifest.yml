name: Sync OTA Manifest to Gitee

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.2)'
        required: true

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate update-manifest.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cat > update-manifest.json <<EOF
          {
            "version": "${TAG}",
            "images": {
              "backend": "${DOCKER_USER}/tradingagents-backend:${TAG}",
              "frontend": "${DOCKER_USER}/tradingagents-frontend:${TAG}"
            }
          }
          EOF
          echo "Generated manifest:"
          cat update-manifest.json

      - name: Upload manifest to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_BRANCH: ${{ secrets.GITEE_BRANCH }}
          TAG: ${{ steps.version.outputs.tag }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_OWNER" ] || [ -z "$GITEE_REPO" ] || [ -z "$DOCKER_USER" ]; then
            echo "::error::Required secrets: DOCKERHUB_USERNAME, GITEE_TOKEN, GITEE_OWNER, GITEE_REPO"
            exit 1
          fi

          BRANCH="${GITEE_BRANCH:-main}"
          FILE_PATH="update-manifest.json"
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/${FILE_PATH}"

          CONTENT_B64=$(base64 -w 0 update-manifest.json 2>/dev/null || base64 update-manifest.json | tr -d '\n')

          SHA=""
          EXISTING=$(curl -sf "${API}?access_token=${GITEE_TOKEN}&ref=${BRANCH}" || true)
          if [ -n "$EXISTING" ]; then
            SHA=$(echo "$EXISTING" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
          fi

          export CONTENT_B64 SHA BRANCH
          PAYLOAD=$(python3 <<'PY'
          import json, os
          payload = {
              "access_token": os.environ["GITEE_TOKEN"],
              "content": os.environ["CONTENT_B64"],
              "message": f"OTA release {os.environ['TAG']}",
              "branch": os.environ.get("BRANCH", "main"),
          }
          sha = os.environ.get("SHA", "")
          if sha:
              payload["sha"] = sha
          print(json.dumps(payload))
          PY
          )

          HTTP_CODE=$(curl -s -o /tmp/gitee_response.json -w "%{http_code}" \
            -X POST "${API}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Manifest uploaded to Gitee successfully."
          else
            echo "::error::Gitee upload failed (HTTP ${HTTP_CODE})"
            cat /tmp/gitee_response.json
            exit 1
          fi

      - name: Summary
        run: |
          echo "## OTA Manifest Synced" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gitee repo: \`${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "部署 Mac \`MANIFEST_URL\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`https://gitee.com/${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}/raw/main/update-manifest.json\`" >> "$GITHUB_STEP_SUMMARY"
