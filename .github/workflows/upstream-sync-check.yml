name: 上游同步检查

permissions:
  contents: write
  issues: write

on:
  schedule:
    # 每周一上午9点检查上游更新
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      force_sync:
        description: '强制同步（跳过确认）'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    name: 检查上游更新
    outputs:
      has_updates: ${{ steps.inspect_upstream.outputs.has_updates }}
      new_commits: ${{ steps.inspect_upstream.outputs.new_commits }}
      recent_commits: ${{ steps.inspect_upstream.outputs.recent_commits }}
      features: ${{ steps.inspect_upstream.outputs.features }}
      fixes: ${{ steps.inspect_upstream.outputs.fixes }}
      docs: ${{ steps.inspect_upstream.outputs.docs }}
      priority: ${{ steps.inspect_upstream.outputs.priority }}
      reason: ${{ steps.inspect_upstream.outputs.reason }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: 配置Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
    
    - name: 添加上游仓库
      run: |
        git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/TauricResearch/TradingAgents.git
        git fetch upstream

    - name: 检查并分析上游更新
      id: inspect_upstream
      shell: bash
      run: |
        NEW_COMMITS=$(git rev-list --count HEAD..upstream/main)
        echo "new_commits=$NEW_COMMITS" >> "$GITHUB_OUTPUT"

        if [ "$NEW_COMMITS" -gt 0 ]; then
          echo "has_updates=true" >> "$GITHUB_OUTPUT"
          git log --oneline --no-merges HEAD..upstream/main | head -10 > recent_commits.txt
          FEATURES=$(git log --oneline --no-merges HEAD..upstream/main | grep -i -E "(feat|feature|add)" | wc -l | tr -d ' ')
          FIXES=$(git log --oneline --no-merges HEAD..upstream/main | grep -i -E "(fix|bug|patch)" | wc -l | tr -d ' ')
          DOCS=$(git log --oneline --no-merges HEAD..upstream/main | grep -i -E "(doc|readme)" | wc -l | tr -d ' ')

          if [ "$FIXES" -gt 0 ]; then
            PRIORITY="high"
            REASON="包含Bug修复"
          elif [ "$FEATURES" -gt 2 ]; then
            PRIORITY="medium"
            REASON="包含多个新功能"
          else
            PRIORITY="low"
            REASON="常规更新"
          fi
        else
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          printf '无新的上游提交\n' > recent_commits.txt
          FEATURES=0
          FIXES=0
          DOCS=0
          PRIORITY="none"
          REASON="无更新"
        fi

        echo "features=$FEATURES" >> "$GITHUB_OUTPUT"
        echo "fixes=$FIXES" >> "$GITHUB_OUTPUT"
        echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
        echo "priority=$PRIORITY" >> "$GITHUB_OUTPUT"
        echo "reason=$REASON" >> "$GITHUB_OUTPUT"
        echo "recent_commits<<EOF" >> "$GITHUB_OUTPUT"
        cat recent_commits.txt >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
    
    - name: 创建Issue报告
      if: steps.inspect_upstream.outputs.has_updates == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const newCommits = '${{ steps.inspect_upstream.outputs.new_commits }}';
          const recentCommits = `${{ steps.inspect_upstream.outputs.recent_commits }}`;
          const features = '${{ steps.inspect_upstream.outputs.features }}';
          const fixes = '${{ steps.inspect_upstream.outputs.fixes }}';
          const docs = '${{ steps.inspect_upstream.outputs.docs }}';
          const priority = '${{ steps.inspect_upstream.outputs.priority }}';
          const reason = '${{ steps.inspect_upstream.outputs.reason }}';
          
          const issueTitle = `🔄 上游更新检测 - ${newCommits} 个新提交`;
          const issueBody = `
          ## 📊 更新概览
          
          - **新提交数量**: ${newCommits}
          - **更新优先级**: ${priority.toUpperCase()}
          - **优先级原因**: ${reason}
          
          ## 📈 更新分析
          
          - 🆕 新功能: ${features} 个
          - 🐛 Bug修复: ${fixes} 个  
          - 📚 文档更新: ${docs} 个
          
          ## 📋 最近提交
          
          \`\`\`
          ${recentCommits}
          \`\`\`
          
          ## 🎯 建议行动
          
          ${priority === 'high' ? 
            '⚠️ **建议立即同步** - 包含重要的Bug修复' : 
            priority === 'medium' ? 
            '📅 **建议本周内同步** - 包含有价值的新功能' : 
            '📝 **可以计划同步** - 常规更新，可以安排时间同步'
          }
          
          ## 🔧 同步步骤
          
          1. 检查当前工作状态
          2. 运行同步脚本: \`python scripts/sync_upstream.py\`
          3. 解决可能的冲突
          4. 测试功能完整性
          5. 更新相关文档
          
          ## 📞 相关链接
          
          - [上游仓库](https://github.com/TauricResearch/TradingAgents)
          - [同步策略文档](docs/maintenance/upstream-sync.md)
          - [同步脚本](scripts/sync_upstream.py)
          
          ---
          
          *此Issue由GitHub Actions自动创建于 ${new Date().toISOString()}*
          `;
          
          // 检查是否已有相似的Issue
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'upstream-sync'
          });
          
          const hasOpenSyncIssue = existingIssues.data.some(issue => 
            issue.title.includes('上游更新检测')
          );
          
          if (!hasOpenSyncIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['upstream-sync', priority === 'high' ? 'priority-high' : priority === 'medium' ? 'priority-medium' : 'priority-low']
            });
            
            console.log('✅ 已创建上游更新Issue');
          } else {
            console.log('ℹ️ 已存在开放的同步Issue，跳过创建');
          }
    
    - name: 发送通知
      if: steps.inspect_upstream.outputs.has_updates == 'true'
      run: |
        echo "📧 上游更新通知已发送"
        echo "- 新提交数量: ${{ steps.inspect_upstream.outputs.new_commits }}"
        echo "- 更新优先级: ${{ steps.inspect_upstream.outputs.priority }}"
        echo "- 已创建Issue进行跟踪"

  auto-sync:
    runs-on: ubuntu-latest
    name: 自动同步（仅限低风险更新）
    needs: check-upstream
    if: |
      needs.check-upstream.outputs.has_updates == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.force_sync) ||
        (needs.check-upstream.outputs.priority == 'low' && needs.check-upstream.outputs.fixes == '0')
      )
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 配置Git
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
    
    - name: 添加上游仓库
      run: |
        git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/TauricResearch/TradingAgents.git
        git fetch upstream
    
    - name: 执行自动同步
      run: |
        python scripts/sync_upstream.py --auto
    
    - name: 推送更新
      run: |
        git push origin HEAD:${{ github.ref_name }}
    
    - name: 创建同步报告
      uses: actions/github-script@v7
      with:
        script: |
          const reportTitle = '🤖 自动同步完成';
          const reportBody = `
          ## ✅ 自动同步成功
          
          GitHub Actions 已自动完成上游同步。
          
          **同步时间**: ${new Date().toISOString()}
          **触发方式**: ${context.eventName === 'workflow_dispatch' ? '手动触发' : '自动触发'}
          
          ## 📋 后续建议
          
          1. 检查同步的更改是否正常
          2. 运行本地测试验证功能
          3. 更新相关文档（如需要）
          
          ---
          
          *此报告由GitHub Actions自动生成*
          `;
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: reportTitle,
            body: reportBody,
            labels: ['upstream-sync', 'auto-sync']
          });
