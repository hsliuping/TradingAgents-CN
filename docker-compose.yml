# TradingAgents-CN v1.0.0-preview Docker Compose配置
# 支持前后端分离部署

services:
  # FastAPI 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tradingagents-backend:v1.0.0-preview
    container_name: tradingagents-backend
    ports:
      - "8000:8000"
    volumes:
      # 日志目录映射
      - ./logs:/app/logs
      # 配置目录映射
      - ./config:/app/config
      # 数据目录映射
      - ./data:/app/data
      - ./runtime/credential-host:/run/alphaguard-credential-host:ro
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      # 日志配置
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_LOG_DIR: "/app/logs"
      TRADINGAGENTS_LOG_FILE: "/app/logs/tradingagents.log"
      # Docker专用数据库配置
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagents?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      # 当前 Settings 使用规范 MONGODB_*/REDIS_* 变量；旧 URL 仅保留兼容。
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: tradingagents123
      MONGODB_AUTH_SOURCE: admin
      MONGODB_DATABASE: "${MONGODB_DATABASE:-tradingagentscn}"
      MONGODB_DATABASE_SCOPE: "${MONGODB_DATABASE_SCOPE:-auto}"
      MONGODB_DATABASE_INSTANCE: "${MONGODB_DATABASE_INSTANCE:-}"
      # Deprecated ConfigManager still consumes these names. Keep it on the
      # same container network/database instead of falling back to localhost.
      MONGODB_CONNECTION_STRING: "mongodb://admin:tradingagents123@mongodb:27017/?authSource=admin"
      MONGODB_DATABASE_NAME: "${MONGODB_DATABASE_NAME:-tradingagentscn}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: tradingagents123
      REDIS_DB: "0"
      # Docker环境标识
      DOCKER_CONTAINER: "true"
      # API配置
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      ALPHAGUARD_SYSTEM_MODE: "${ALPHAGUARD_SYSTEM_MODE:-SIM_AUTONOMOUS}"
      ALPHAGUARD_LIVE_TRADING_ENABLED: "${ALPHAGUARD_LIVE_TRADING_ENABLED:-false}"
      ALPHAGUARD_CREDENTIAL_HOST_URL: "http://host.docker.internal:8011"
      ALPHAGUARD_CREDENTIAL_HOST_TOKEN_FILE: "/run/alphaguard-credential-host/access.token"
      # CORS配置
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost:5173"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 旧 Redis 队列消费者；保持现有任务入口并暴露带 TTL 的心跳。
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tradingagents-backend:v1.0.0-preview
    container_name: tradingagents-queue-worker
    command: ["python", "app/worker.py"]
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
      - ./runtime/credential-host:/run/alphaguard-credential-host:ro
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagents?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: tradingagents123
      MONGODB_AUTH_SOURCE: admin
      MONGODB_DATABASE: "${MONGODB_DATABASE:-tradingagentscn}"
      MONGODB_DATABASE_SCOPE: "${MONGODB_DATABASE_SCOPE:-auto}"
      MONGODB_DATABASE_INSTANCE: "${MONGODB_DATABASE_INSTANCE:-}"
      MONGODB_CONNECTION_STRING: "mongodb://admin:tradingagents123@mongodb:27017/?authSource=admin"
      MONGODB_DATABASE_NAME: "${MONGODB_DATABASE_NAME:-tradingagentscn}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: tradingagents123
      REDIS_DB: "0"
      DOCKER_CONTAINER: "true"
      ALPHAGUARD_SYSTEM_MODE: "${ALPHAGUARD_SYSTEM_MODE:-SIM_AUTONOMOUS}"
      ALPHAGUARD_LIVE_TRADING_ENABLED: "${ALPHAGUARD_LIVE_TRADING_ENABLED:-false}"
      ALPHAGUARD_CREDENTIAL_HOST_URL: "http://host.docker.internal:8011"
      ALPHAGUARD_CREDENTIAL_HOST_TOKEN_FILE: "/run/alphaguard-credential-host/access.token"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 现行分析 Worker；与 queue-worker 使用相同 fail-closed 安全配置。
  analysis-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tradingagents-backend:v1.0.0-preview
    container_name: tradingagents-analysis-worker
    command: ["python", "-m", "app.worker.analysis_worker"]
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
      - ./runtime/credential-host:/run/alphaguard-credential-host:ro
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagents?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: tradingagents123
      MONGODB_AUTH_SOURCE: admin
      MONGODB_DATABASE: "${MONGODB_DATABASE:-tradingagentscn}"
      MONGODB_DATABASE_SCOPE: "${MONGODB_DATABASE_SCOPE:-auto}"
      MONGODB_DATABASE_INSTANCE: "${MONGODB_DATABASE_INSTANCE:-}"
      MONGODB_CONNECTION_STRING: "mongodb://admin:tradingagents123@mongodb:27017/?authSource=admin"
      MONGODB_DATABASE_NAME: "${MONGODB_DATABASE_NAME:-tradingagentscn}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: tradingagents123
      REDIS_DB: "0"
      DOCKER_CONTAINER: "true"
      ALPHAGUARD_SYSTEM_MODE: "${ALPHAGUARD_SYSTEM_MODE:-SIM_AUTONOMOUS}"
      ALPHAGUARD_LIVE_TRADING_ENABLED: "${ALPHAGUARD_LIVE_TRADING_ENABLED:-false}"
      ALPHAGUARD_CREDENTIAL_HOST_URL: "http://host.docker.internal:8011"
      ALPHAGUARD_CREDENTIAL_HOST_TOKEN_FILE: "/run/alphaguard-credential-host/access.token"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Vue 3 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: tradingagents-frontend:v1.0.0-preview
    container_name: tradingagents-frontend
    ports:
      - "3000:80"
    environment:
      TZ: "Asia/Shanghai"
      # 后端API地址
      VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # MongoDB 数据库服务
  mongodb:
    image: mongo:4.4
    container_name: tradingagents-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tradingagents123
      MONGO_INITDB_DATABASE: tradingagents
      TZ: "Asia/Shanghai"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - tradingagents-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: tradingagents-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server --appendonly yes --requirepass tradingagents123
    volumes:
      - redis_data:/data
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis Commander 管理界面（可选）
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: tradingagents-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:tradingagents123
    networks:
      - tradingagents-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - management

  # Mongo Express 管理界面（可选）
  mongo-express:
    image: mongo-express:latest
    container_name: tradingagents-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: tradingagents123
      ME_CONFIG_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: tradingagents123
    networks:
      - tradingagents-network
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - management

# 数据卷定义
volumes:
  mongodb_data:
    driver: local
    name: tradingagents_mongodb_data
  redis_data:
    driver: local
    name: tradingagents_redis_data

# 网络定义
networks:
  tradingagents-network:
    driver: bridge
    name: tradingagents-network
