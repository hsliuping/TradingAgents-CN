[pytest]
testpaths = tests
python_files = test_*.py *_test.py
addopts = --alphaguard-suite=offline
markers =
    unit: deterministic unit test
    integration: deterministic integration test using controlled local fakes/services
    network: explicit test that may access a live provider or HTTP service
    interactive: explicit test that may wait for terminal input
    manual: operator-driven smoke/debug test
    legacy_collection_error: retained legacy module with a known collection-time error
