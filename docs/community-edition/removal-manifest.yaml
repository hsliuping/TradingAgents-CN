# =============================================================================
# 社区版剔除清单（removal-manifest）
# =============================================================================
# 用途：scripts/publish_community.py 按本清单将私有仓代码生成为社区版快照。
# 铁律：剔除动作必须是"整文件删除 / 整目录删除 / 整文件替换"，禁止行级修改。
#
# 变更纪律：
#   - 新增 Pro 路由 → 登记 delete_files（app/routers/xxx.py + app/pro_routers.py 内登记）
#   - 新增 Pro 页面 → 放入 frontend/src/views/pro/，自动随目录剔除
#   - 新增 Pro API 封装 → 登记 delete_files
#   - 清单变更后必须重新生成并通过全部校验（import 自检 / vue-tsc / build / 泄露扫描）
# =============================================================================

version: "2026-09-18-r8"
description: "v3.6.0 社区版开源分离 · r8 stock_data/financial_data 划回社区版"

# ---------------------------------------------------------------------------
# 整目录删除
# ---------------------------------------------------------------------------
delete_dirs:
  # --- 前端 Pro 页面（M1 §7.2 目录化，37+ 个组件）---
  - frontend/src/views/pro
  # --- 前端 Pro 死页面（引用被剔除的 Pro API，无路由注册）---
  - frontend/src/views/Debug/LicenseDebug.vue
  - frontend/src/views/Debug/AgentAvailability.vue
  # --- 付费课程（docs/07-courses 仅保留 v3.0/phase-01-discover 前 5 课）---
  - docs/07-courses/advanced
  - docs/07-courses/v3.0/appendices
  - docs/07-courses/v3.0/phase-02-track
  - docs/07-courses/v3.0/phase-03-position
  - docs/07-courses/v3.0/phase-04-review
  - docs/07-courses/v3.0/phase-05-short-term
  - docs/07-courses/v3.0/phase-06-long-term
  - docs/07-courses/v3.0/phase-07-extension
  - docs/07-courses/v3.0/phase-08-personal-plan
  # --- 内部文档（产品/开发/运维/设计/知识/归档，不开源；社区版手册 M4 另出）---
  - docs/01-product
  # 02-user-guide：仅保留 user-manual-v3.0.md 与 learning-01..08（前端 userManualContent.ts
  # 与学习中心 Article.vue 引用）；内部子目录与旧版/京东云私有文档剔除
  - docs/02-user-guide/advanced
  - docs/02-user-guide/configuration
  - docs/02-user-guide/features
  - docs/02-user-guide/getting-started
  - docs/03-development
  - docs/04-operations
  - docs/05-design
  - docs/06-knowledge
  - docs/08-blog
  - docs/99-archive
  - docs/community-edition
  # --- 社媒爬虫示例（付费社媒链路配套）---
  - examples
  # --- 内部开发工具脚本堆（一次性调试/修复/种子脚本，数百个）---
  - scripts
  # --- 京东云 All-in-One 部署（私有交付物：源码保护脚本/签名/jdyun 配置）---
  - deploy-all-in-one
  # --- AI 助手内部配置（私有开发规则/技能库，非开源交付物）---
  - .augment
  - .claude
  - .cursor
  # --- 软著申请材料（源码 PDF/PPT/截图，私有）---
  - copyright_submission
  # --- 内部合规审计导出与 DB 模板备份（工作产物）---
  - exports
  # --- 内部发布工件（历史版本 manifest/升级建议，私有发布流程产物）---
  - releases
  # --- GPLv3 回测微服务（消费者 app/services/backtest_service.py 已剔除；compose 中为 profile 可选服务，默认不启动，hub compose 无引用）---
  - backtest-service
  # --- 7zip 二进制（仅私有打包脚本引用；backups.py 等运行时路径均有 os.path.exists 防护，缺失优雅降级）---
  - vendors

