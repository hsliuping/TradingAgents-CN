# ---------------------------------------------------------------------------
# 整文件替换：社区版模板（scripts/community_templates/ → 目标路径）
# ---------------------------------------------------------------------------
replace_files:
  # 后端：门控薄壳（re-export community_stub，调用方零改动）
  - template: backend/permissions.py
    target: app/core/permissions.py
  - template: backend/license_service.py
    target: app/services/license_service.py
  - template: backend/licensing__init__.py
    target: core/licensing/__init__.py
  # 前端：空配置（消费方零改动）
  - template: frontend/pro.routes.ts
    target: frontend/src/router/pro.routes.ts
  - template: frontend/navigation.pro.ts
    target: frontend/src/config/navigation.pro.ts
  # 前端：免费课程配置（去除付费 import）
  - template: frontend/advancedCourses.ts
    target: frontend/src/config/advancedCourses.ts
  - template: frontend/advancedCourseContent.ts
    target: frontend/src/config/advancedCourseContent.ts
  # 社区版 README 与许可证
  - template: README.md
    target: README.md
  - template: LICENSE
    target: LICENSE
  # 前端：付费引导组件空壳（被社区共享页面引用，删组件会崩，整文件替换为空壳）
  - template: frontend/KnowledgePlanetPromotion.vue
    target: frontend/src/components/KnowledgePlanetPromotion.vue
  - template: frontend/LicenseAlert.vue
    target: frontend/src/components/Layout/LicenseAlert.vue
  - template: frontend/PaidCourseBadge.vue
    target: frontend/src/components/PaidCourseBadge.vue
  # 前端：Pro API 空壳（被社区共享组件引用：持仓复盘/操作历史的"关联交易计划"下拉，返回空数据自然降级）
  - template: frontend/tradingSystem.ts
    target: frontend/src/api/tradingSystem.ts
  # 前端：Pro 功能弹窗空壳（执行轨迹查看，被社区任务中心引用）
  - template: frontend/ExecutionTraceDialog.vue
    target: frontend/src/views/Tasks/components/ExecutionTraceDialog.vue
  # 前端：license store 空壳（社区版无授权体系：不发 /api/license/status 探活请求，
  # isPro 恒 false、hasFeature 仅放行免费功能，接口与 Pro 版完全一致，消费方零改动）
  - template: frontend/license.ts
    target: frontend/src/stores/license.ts

