  - core/tools/implementations/agent_builder/*  # 顶层 import Pro 服务，但加载链均在 try/except 内（thread_worker/agent_builder_nodes），社区版不触发顶层加载，运行时安全降级
  - docs/images                         # 课程/页面图片（无害保留）
  - docs/07-courses/v3.0/phase-01-discover  # 免费课程 5 课（社区版学习中心引用）
  - docs/02-user-guide/user-manual-v3.0.md  # 标准版手册（userManualContent.ts 引用）
  - docs/02-user-guide/learning-01..08  # 学习中心文章 10 篇（Article.vue 引用；论文中文版已自 features/ 迁入 learning-06-resources/）
  - data/analysis_results  # 历史样例分析报告（公开仓 v1.x 同名目录先例）
  - reports                # 内部修复报告（公开仓 v1.x 同名目录先例，内容一致）

# ---------------------------------------------------------------------------
# 泄露扫描模式
# - 源码扫描：只扫高价值商业内容（符号名/文案类模式误报率高，代码层防线由
#   import 自检 + vue-tsc 承担）
# - dist 扫描：前端构建产物，宽扫描（任何 Pro 痕迹都不应出现）
# - M4 待办（文案级残留，dist 扫描已知命中 17 处，均为死分支/字符串级，无功能性泄露）：
#   1) 共享页面"高级学员"死分支提示语（PositionReviewDialog/DataImport/BasicLayout 等 v-if 门控分支）
#   2) stores/license.ts Pro 功能键列表（watchlist_groups/scheduled_analysis/prompt_templates）
#   3) DatabaseManagement.vue 演示数据导出的 Pro 集合名（社区版集合不存在，导出自动跳过）
#   4) SkillGenerationCreate.vue Agent 工坊承接死分支（社区版无 from_agent_workshop 查询入口）
#   5) ReviewDetailDialog/StockOperationHistoryDialog 交易计划展示死分支（社区版报告无该字段）
#   6) api/review.ts trading_system_id/name 可选类型字段（类型声明，无运行时痕迹）
#   7) user-manual-v3.0.md 含 Pro 功能说明（社区版手册 M4 另出后替换）
#   8) USER_AGREEMENT 条款、channel_config"企业微信"枚举
#   9) 社区页面加载"分析流程"下拉框调 GET /api/workflows 返回 404（SingleAnalysis/GeneralAnalysis/
#      PositionReviewDialog/PositionAnalysisDialog，前端 catch 兜底回退默认分析模式，仅 Console 网络层红字，功能无损）
#      ※ license/status 404 原第 10 项已修复：stores/license.ts 整文件替换为无网络请求 stub
# ---------------------------------------------------------------------------
scan_source_patterns:
  - "知识星球"
  - "LicenseValidator"
  - "advancedCourses.pro"
  - "京东云合作协议"
  - "AgentEngine"
  - "投稿稿"
  - "copyright_submission"
scan_dist_patterns:
  - "require_pro"
  - "trading_system"
  - "agent_workshop"
  - "workflow_generation"
  - "social_media"
  - "prompt_templates"
  - "watchlist_groups"
  - "scheduled_analysis"
  - "execution_trace"
  - "mcp_service"
  - "知识星球"
  - "高级学员"
