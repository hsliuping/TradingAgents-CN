id: verifier.valuation.peg_basic
object_type: verifier_rule
scenario: skill_generation
target_contract_id: contract.valuation.peg_basic
check_type: applicability_and_growth_quality
rule_level: method
blocking: true
params:
  required_fields:
    - method_name
    - metric_value
    - growth_basis
    - sustainability_assessment
    - conclusion
  applicability_rules:
    - rule.peg_requires_meaningful_growth
failure_message: PEG 估值输出缺少关键字段，或未说明增长率口径与持续性。
remediation_hint: 补充增长来源、增长窗口和持续性判断，避免把短期异常增长直接当作 PEG 的有效依据。
version: 1.0.0