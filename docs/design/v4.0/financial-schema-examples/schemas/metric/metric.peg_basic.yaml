id: metric.peg_basic
object_type: metric
name: 基础 PEG
formula: PE / 未来一年或近三年可解释增长率
machine_formula:
  op: divide
  left: metric.pe_ttm
  right: financial.earnings_growth_rate_pct
numerator:
  - metric.pe_ttm
denominator:
  - financial.earnings_growth_rate_pct
unit: x
frequency: forward_or_derived
preconditions:
  - metric.pe_ttm exists
  - financial.earnings_growth_rate_pct exists
  - financial.earnings_growth_rate_pct > 0
invalid_conditions:
  - financial.earnings_growth_rate_pct <= 0
interpretation_guidelines:
  - 增长率必须说明口径和时间区间
  - 对一次性高增长或周期反转型增长要谨慎
related_concepts:
  - concept.peg
  - concept.pe
version: 1.0.0