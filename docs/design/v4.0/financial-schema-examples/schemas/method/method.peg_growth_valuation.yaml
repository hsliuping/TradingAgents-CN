id: method.peg_growth_valuation
object_type: method
name: PEG 成长估值法
family: valuation
objective: 将 PE 与增长率结合，用于判断成长型公司的估值与增长是否匹配。
required_metrics:
  - metric.pe_ttm
  - metric.peg_basic
required_fields:
  - financial.earnings_growth_rate_pct
steps:
  - 明确增长率口径和观察窗口
  - 检查增长是否来源于可持续经营改善
  - 计算或引用 PEG
  - 比较不同成长公司之间的相对估值
  - 说明增长不确定性和适用边界
assumptions:
  - 增长率具备可持续性
  - 利润并非严重受一次性项目影响
strengths:
  - 更适合成长股比较
  - 能把估值和增长联系起来
limitations:
  - 对异常增长和负增长失真严重
  - 对周期股和利润大起大落企业不稳定
common_failure_modes:
  - 直接使用不可持续高增长
  - 未说明增长口径来源
output_contract_ids:
  - contract.valuation.peg_basic
verifier_rule_ids:
  - verifier.valuation.peg_basic
version: 1.0.0