id: contract.valuation.pb_basic
object_type: output_contract
name: PB 估值基础输出契约
scenario: valuation_skill
required_fields:
  - field_name: method_name
    field_type: string
    description: 使用的方法名称
    nullable: false
    source_requirement: must_state_method
  - field_name: metric_value
    field_type: number
    description: 当前 PB 指标值
    nullable: false
    source_requirement: from_metric_or_calculation
  - field_name: benchmark_basis
    field_type: string
    description: PB 的比较基准
    nullable: false
    source_requirement: must_state_basis
  - field_name: roe_context
    field_type: string
    description: 与 ROE 或资产质量的联动解释
    nullable: false
    source_requirement: must_state_roe_context
  - field_name: conclusion
    field_type: string
    description: 估值结论
    nullable: false
    source_requirement: must_state_conclusion
optional_fields:
  - field_name: applicability_check
    field_type: object
    description: 行业适用性说明
  - field_name: risk_notes
    field_type: array[string]
    description: 风险提示
narrative_requirements:
  - 必须说明为什么使用 PB
  - 必须说明 ROE 或资产质量背景
prohibited_patterns:
  - 仅凭 PB 高低直接断言低估或高估
example_payload:
  method_name: PB 相对估值法
  metric_value: 0.92
  benchmark_basis: 低于近三年平均 1.05 倍 PB
  roe_context: 当前 ROE 维持在行业中位附近，低 PB 具备一定解释力。
  conclusion: 当前 PB 位于历史偏低区间，但需要继续跟踪资产质量变化。
version: 1.0.0