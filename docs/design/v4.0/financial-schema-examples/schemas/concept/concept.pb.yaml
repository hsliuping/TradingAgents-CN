id: concept.pb
object_type: concept
name: 市净率
aliases:
  - PB
  - 市净率
  - Price to Book
category: valuation_metric
summary: 以价格相对于净资产衡量估值水平的核心指标。
definition: >-
  市净率表示股价或市值相对于账面净资产的倍数，常用于重资产行业和金融行业的相对估值比较。
interpretation: >-
  PB 越高通常表示市场给予更高盈利能力预期或资产质量溢价，PB 越低可能表示估值便宜，
  也可能表示资产质量、盈利能力或景气度存在问题。
common_misunderstandings:
  - PB 小于 1 就必然低估
  - PB 适合解释所有轻资产公司
  - 不需要结合 ROE 看 PB
related_concepts:
  - concept.pe
tags:
