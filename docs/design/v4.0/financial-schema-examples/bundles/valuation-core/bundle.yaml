bundle_id: valuation-core
name: 估值核心样例包
bundle_version: 1.0.0
spec_version: 1.0.0
status: draft
description: 首批估值类金融 schema 样例包，覆盖 PE、PB、PEG 三类估值对象。
includes:
  concept:
    - concept.pe
    - concept.pb
    - concept.peg
  metric:
    - metric.pe_ttm
    - metric.pb
    - metric.peg_basic
  method:
    - method.pe_relative_valuation
    - method.pb_relative_valuation
    - method.peg_growth_valuation
  applicability_rule:
    - rule.pe_requires_positive_earnings
    - rule.pb_preferred_for_banks
    - rule.peg_requires_meaningful_growth
  output_contract:
    - contract.valuation.pe_basic
    - contract.valuation.pb_basic
    - contract.valuation.peg_basic
  verifier_rule:
    - verifier.valuation.pe_basic
    - verifier.valuation.pb_basic
    - verifier.valuation.peg_basic