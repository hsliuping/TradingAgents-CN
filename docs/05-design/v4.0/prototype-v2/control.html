<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>系统控制台 · TradingAgents v4.0</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
  <link rel="stylesheet" href="./assets/theme.css?v=4" />
  <style>
    .console-page .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 20px;
    }
    .console-page .page-header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .console-page .page-subtitle {
      max-width: 760px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mode-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid transparent;
    }
    .mode-banner.is-auto {
      background: linear-gradient(135deg, rgba(107,72,227,.08), rgba(64,158,255,.08));
      border-color: rgba(64,158,255,.18);
    }
    .mode-banner.is-cautious {
      background: linear-gradient(135deg, rgba(230,162,60,.08), rgba(247,186,42,.08));
      border-color: rgba(230,162,60,.18);
    }
    .mode-banner.is-maintenance {
      background: linear-gradient(135deg, rgba(245,108,108,.08), rgba(230,162,60,.08));
      border-color: rgba(245,108,108,.18);
    }
    .banner-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .banner-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .banner-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .console-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .subnav-card,
    .content-card,
    .sidebar-card,
    .purpose-panel,
    .stat-card,
    .scheduler-card,
    .sync-card,
    .service-card {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
    }
    .subnav-card {
      position: sticky;
      top: 24px;
      padding: 14px;
    }
    .subnav-title {
      font-size: 12px;
      color: var(--text-placeholder);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 10px;
      padding: 0 6px;
    }
    .subnav-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      padding: 12px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      border: 1px solid transparent;
      margin-bottom: 8px;
    }
    .subnav-item:hover {
      background: var(--el-color-primary-light-9);
    }
    .subnav-item.is-active {
      background: var(--el-color-primary-light-9);
      border-color: var(--el-color-primary-light-7);
    }
    .subnav-item .nav-copy {
      min-width: 0;
      flex: 1;
    }
    .subnav-item .nav-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .subnav-item .nav-desc {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .content-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .content-card,
    .sidebar-card {
      padding: 18px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .section-meta {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .purpose-panel {
      padding: 20px 22px;
    }
    .purpose-panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .purpose-panel .purpose-desc {
      font-size: 13px;
      line-height: 1.8;
      color: var(--text-secondary);
    }
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }
    .stat-card {
      padding: 14px 16px;
    }
    .stat-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .stat-card .value {
      font-size: 24px;
      line-height: 1.1;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .stat-card .meta {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-tertiary);
    }

    .overview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, .7fr);
      gap: 16px;
    }
    .overview-block + .overview-block,
    .sidebar-card + .sidebar-card {
      margin-top: 16px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .service-card {
      padding: 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    .service-card:hover {
      box-shadow: var(--shadow-card-hover);
    }
    .service-card.is-ok {
      border-color: rgba(103,194,58,.24);
    }
    .service-card.is-degraded {
      border-color: rgba(230,162,60,.28);
      background: linear-gradient(180deg, rgba(230,162,60,.04), rgba(255,255,255,1));
    }
    .service-card.is-offline {
      border-color: rgba(245,108,108,.28);
      background: linear-gradient(180deg, rgba(245,108,108,.04), rgba(255,255,255,1));
    }
    .service-head,
    .scheduler-head,
    .sync-head,
    .event-head,
    .alert-head,
    .quick-op-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .service-name,
    .scheduler-name,
    .sync-name,
    .event-title,
    .alert-title,
    .quick-op-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .service-kind,
    .scheduler-meta,
    .sync-meta,
    .event-meta,
    .alert-meta,
    .rule-desc,
    .quick-op-desc,
    .item-desc {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .service-metrics,
    .sync-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      margin-bottom: 10px;
    }
    .service-metric,
    .sync-metric {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .service-metric strong,
    .sync-metric strong {
      display: block;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
    }
    .service-note,
    .scheduler-note,
    .sync-note,
    .mini-note {
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--bg-page);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .service-actions,
    .scheduler-actions,
    .sync-actions,
    .alert-actions,
    .quick-op-actions,
    .pane-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table thead th {
      text-align: left;
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 12px;
      padding: 10px 12px;
      background: var(--bg-page);
      border-bottom: 1px solid var(--border-light);
    }
    .data-table thead th.num,
    .data-table tbody td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .data-table tbody td {
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
      color: var(--text-primary);
    }
    .data-table tbody tr:last-child td {
      border-bottom: none;
    }
    .data-table tbody tr:hover {
      background: var(--bg-page);
    }

    .scheduler-grid,
    .sync-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .scheduler-card,
    .sync-card {
      padding: 16px;
    }
    .scheduler-desc,
    .sync-desc,
    .event-body,
    .alert-body {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .event-item,
    .alert-item,
    .rule-item,
    .quick-op,
    .mini-item {
      padding: 12px 0;
      border-top: 1px solid var(--border-light);
    }
    .event-item:first-child,
    .alert-item:first-child,
    .rule-item:first-child,
    .quick-op:first-child,
    .mini-item:first-child {
      padding-top: 0;
      border-top: none;
    }
    .rule-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
    }
    .empty-note {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-tertiary);
    }
    .inline-kv {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .inline-kv span {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-page);
      border-radius: 999px;
      padding: 4px 8px;
    }

    @media (max-width: 1220px) {
      .console-layout,
      .overview-grid {
        grid-template-columns: 1fr;
      }
      .subnav-card {
        position: static;
      }
      .stat-strip,
      .service-grid,
      .scheduler-grid,
      .sync-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 920px) {
      .console-page .page-header,
      .mode-banner,
      .banner-actions,
      .header-actions {
        flex-direction: column;
        align-items: flex-start;
      }
      .service-metrics,
      .sync-metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <app-shell active="control" page-title="系统控制台" :breadcrumb="[{label:'方法与系统'},{label:'系统控制台'}]">
      <div class="console-page">
        <div class="page-header">
          <div>
            <h1>系统控制台</h1>
            <div class="page-subtitle">
              系统控制页现在按功能拆成独立子菜单，而不是把所有操作堆在一张长页里。你可以分别管理运行总览、依赖健康、定时任务、数据同步和告警策略。
            </div>
          </div>
          <div class="header-actions">
            <el-button plain @click="refreshFromStorage(true)">
              <el-icon><Refresh /></el-icon>&nbsp;同步跨页状态
            </el-button>
            <el-button plain @click="showMaintenanceDialog = true">
              <el-icon><Tools /></el-icon>&nbsp;设置维护窗口
            </el-button>
            <el-button type="primary" @click="runHealthCheck">
              <el-icon><Connection /></el-icon>&nbsp;执行健康检查
            </el-button>
          </div>
        </div>

        <div class="mode-banner" :class="'is-' + modeTone">
          <div>
            <div class="banner-title">当前运行模式：{{ modeLabel }}</div>
            <div class="banner-desc">
              {{ modeDescription }}
              <template v-if="state.maintenance">
                · 维护到 {{ state.maintenance.endAt }} · 原因：{{ state.maintenance.reason }}
              </template>
            </div>
          </div>
          <div class="banner-actions">
            <el-tag size="small" :type="activeAlertCount ? 'warning' : 'success'" effect="light">{{ activeAlertCount }} 条活跃告警</el-tag>
            <el-tag size="small" effect="plain">{{ queueRows.length }} 个任务视图</el-tag>
            <el-button v-if="state.maintenance" size="small" plain @click="endMaintenance">结束维护</el-button>
          </div>
        </div>

        <div class="console-layout">
          <aside class="subnav-card">
            <div class="subnav-title">系统控制菜单</div>
            <div
              class="subnav-item"
              v-for="item in navItems"
              :key="item.key"
              :class="{ 'is-active': activePane === item.key }"
              @click="activePane = item.key"
            >
              <el-icon><component :is="item.icon" /></el-icon>
              <div class="nav-copy">
                <div class="nav-label">{{ item.label }}</div>
                <div class="nav-desc">{{ item.desc }}</div>
              </div>
            </div>
          </aside>

          <div class="content-stack">
            <template v-if="activePane === 'overview'">
              <div class="purpose-panel">
                <h2>概览</h2>
                <div class="purpose-desc">
                  这一页只看全局健康，不处理具体配置。适合先判断今天系统是否能支撑研究，再决定要进入哪个子菜单继续操作。
                </div>
              </div>

              <div class="stat-strip">
                <div class="stat-card" v-for="stat in stats" :key="stat.label">
                  <div class="label">{{ stat.label }}</div>
                  <div class="value">{{ stat.value }}</div>
                  <div class="meta">{{ stat.meta }}</div>
                </div>
              </div>

              <div class="overview-grid">
                <div>
                  <div class="content-card overview-block">
                    <div class="section-header">
                      <h2>关键依赖快照</h2>
                      <span class="section-meta">优先看是否有阻塞主链路的问题</span>
                    </div>
                    <div class="service-grid">
                      <div class="service-card" v-for="service in criticalServices" :key="service.id" :class="'is-' + service.status">
                        <div class="service-head">
                          <div>
                            <div class="service-name">{{ service.name }}</div>
                            <div class="service-kind">{{ service.category }} · {{ statusLabel(service.status) }}</div>
                          </div>
                          <el-tag size="small" :type="serviceTagType(service.status)" effect="light">{{ statusLabel(service.status) }}</el-tag>
                        </div>
                        <div class="service-desc">{{ service.desc }}</div>
                        <div class="service-note" v-if="service.notice">{{ service.notice }}</div>
                        <div class="service-actions">
                          <el-button size="small" plain @click="openServiceDialog(service)">查看详情</el-button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="content-card overview-block">
                    <div class="section-header">
                      <h2>任务与队列</h2>
                      <a href="./task.html" class="text-sm">任务中心 →</a>
                    </div>
                    <table class="data-table">
                      <thead>
                        <tr>
                          <th>任务</th>
                          <th>类型</th>
                          <th>当前阶段</th>
                          <th class="num">待沉淀</th>
                          <th>通道</th>
                          <th>最近更新时间</th>
                          <th>操作</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr v-for="row in queueRows" :key="row.id">
                          <td>
                            <div class="fw-500">{{ row.title }}</div>
                            <div class="text-xs muted" style="margin-top: 4px;">{{ row.id }} · {{ row.status }}</div>
                          </td>
                          <td><el-tag size="small" :type="row.statusType" effect="light">{{ row.kind }}</el-tag></td>
                          <td>{{ row.stage }}</td>
                          <td class="num">{{ row.pendingDeposits }}</td>
                          <td>{{ row.lane }}</td>
                          <td>{{ row.updatedAt }}</td>
                          <td><a :href="row.href" class="text-sm">查看 →</a></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                <div>
                  <div class="sidebar-card">
                    <div class="section-header">
                      <h2>活跃告警</h2>
                      <el-button size="small" link @click="activePane = 'alerts'">进入告警策略</el-button>
                    </div>
                    <div v-if="activeAlerts.length">
                      <div class="alert-item" v-for="alert in activeAlerts.slice(0, 3)" :key="alert.id">
                        <div class="alert-head">
                          <div class="alert-title">{{ alert.title }}</div>
                          <el-tag size="small" :type="alertTagType(alert.severity)" effect="light">{{ alertLabel(alert.severity) }}</el-tag>
                        </div>
                        <div class="alert-body">{{ alert.body }}</div>
                        <div class="alert-meta">{{ alert.source }} · {{ alert.time }}</div>
                      </div>
                    </div>
                    <div v-else class="empty-note">当前没有活跃告警。</div>
                  </div>

                  <div class="sidebar-card">
                    <div class="section-header">
                      <h2>最近运行事件</h2>
                      <span class="section-meta">保留最近 12 条</span>
                    </div>
                    <div class="event-item" v-for="item in recentActivities.slice(0, 5)" :key="item.id">
                      <div class="event-head">
                        <div class="event-title">{{ item.title }}</div>
                        <el-tag size="small" :type="activityTagType(item.tone)" effect="light">{{ activityLabel(item.tone) }}</el-tag>
                      </div>
                      <div class="event-body">{{ item.body }}</div>
                      <div class="event-meta">{{ item.time }}</div>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <template v-else-if="activePane === 'services'">
              <div class="content-card">
                <div class="section-header">
                  <div>
                    <h2>运行依赖</h2>
                    <div class="section-meta">模型 / 数据源 / 执行 / 存储</div>
                  </div>
                  <div class="pane-actions">
                    <el-button size="small" plain @click="runHealthCheck">立即探测</el-button>
                  </div>
                </div>
                <div class="service-grid">
                  <div class="service-card" v-for="service in state.services" :key="service.id" :class="'is-' + service.status">
                    <div class="service-head">
                      <div>
                        <div class="service-name">{{ service.name }}</div>
                        <div class="service-kind">{{ service.category }} · {{ statusLabel(service.status) }}</div>
                      </div>
                      <el-tag size="small" :type="serviceTagType(service.status)" effect="light">{{ statusLabel(service.status) }}</el-tag>
                    </div>
                    <div class="service-desc">{{ service.desc }}</div>
                    <div class="service-metrics">
                      <div class="service-metric"><strong>{{ service.latency }}</strong>当前延迟 / 负载</div>
                      <div class="service-metric"><strong>{{ service.lastCheck }}</strong>最近一次检查</div>
                      <div class="service-metric"><strong>{{ service.dependency }}</strong>依赖对象</div>
                      <div class="service-metric"><strong>{{ service.fallback }}</strong>备用策略</div>
                    </div>
                    <div class="service-note" v-if="service.notice">{{ service.notice }}</div>
                    <div class="service-actions">
                      <el-button size="small" plain @click="openServiceDialog(service)">查看详情</el-button>
                      <el-button
                        size="small"
                        plain
                        :type="service.status === 'degraded' ? 'success' : (service.status === 'offline' ? 'primary' : 'warning')"
                        @click="toggleServiceStatus(service)"
                      >{{ service.status === 'ok' ? '模拟降级' : '恢复服务' }}</el-button>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <template v-else-if="activePane === 'schedules'">
              <div class="content-card">
                <div class="section-header">
                  <div>
                    <h2>定时任务</h2>
                    <div class="section-meta">统一管理扫描、同步、巡检与复盘触发器</div>
                  </div>
                  <div class="pane-actions">
                    <el-button plain @click="showSchedulerDialog = true">
                      <el-icon><Plus /></el-icon>&nbsp;新增定时任务
                    </el-button>
                  </div>
                </div>
                <div class="scheduler-grid">
                  <div class="scheduler-card" v-for="job in state.schedulers" :key="job.id">
                    <div class="scheduler-head">
                      <div>
                        <div class="scheduler-name">{{ job.name }}</div>
                        <div class="scheduler-meta">{{ job.type }} · {{ job.schedule }} · {{ job.owner }}</div>
                      </div>
                      <el-switch v-model="job.enabled" @change="toggleScheduler(job)" />
                    </div>
                    <div class="scheduler-desc">{{ job.desc }}</div>
                    <div class="inline-kv">
                      <span>最近执行：{{ job.lastRun }}</span>
                      <span>下次执行：{{ job.nextRun }}</span>
                      <span>失败处理：{{ job.retryPolicy }}</span>
                    </div>
                    <div class="scheduler-note">{{ job.note }}</div>
                    <div class="scheduler-actions">
                      <el-button size="small" plain @click="runSchedulerNow(job)">立即执行</el-button>
                      <el-button size="small" plain @click="openSchedulerDialog(job)">编辑</el-button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="content-card">
                <div class="section-header">
                  <h2>执行窗口与冲突策略</h2>
                  <span class="section-meta">避免同步、扫描与大任务互相抢占通道</span>
                </div>
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>任务名称</th>
                      <th>优先级</th>
                      <th>时间窗口</th>
                      <th>冲突策略</th>
                      <th>当前状态</th>
                    </tr>
                  </thead>
                  <tbody>

    const { createApp } = Vue;
    const app = createApp({
      data() {
        return {
          state: defaultControlState(),
          tasksSnapshot: [],
          activePane: 'overview',
          navItems: [
            { key: 'overview', label: '概览', desc: '看整体健康、队列和关键告警', icon: 'Grid' },
            { key: 'services', label: '运行依赖', desc: '管理模型、数据源、执行与存储', icon: 'Connection' },
            { key: 'schedules', label: '定时任务', desc: '配置候选扫描、巡检和夜间任务', icon: 'Timer' },
            { key: 'sync', label: '数据同步', desc: '管理同步源、频率与兜底策略', icon: 'RefreshRight' },
            { key: 'alerts', label: '告警与策略', desc: '处理异常、维护窗口与自动化规则', icon: 'Bell' },
          ],
          showMaintenanceDialog: false,
          showServiceDialog: false,
          showSchedulerDialog: false,
          showSyncDialog: false,
          selectedService: null,
          selectedSchedulerId: null,
          selectedSyncId: null,
          maintenanceForm: {
            owner: '老张',
            endAt: '今天 18:30',
            reason: '',
            drainQueue: true,
          },
          schedulerForm: {
            id: null,
            name: '',
            type: '候选扫描',
            schedule: '',
            priority: 'P1',
            window: '',
            conflictPolicy: '',
            desc: '',
          },
          syncForm: {
            id: null,
            name: '',
            source: '',
            target: '',
            frequency: '',
            scope: '',
            delay: '',
            desc: '',
          },
        };
      },
      computed: {
        healthyServiceCount() {
          return this.state.services.filter((item) => item.status === 'ok').length;
        },
        degradedServiceCount() {
          return this.state.services.filter((item) => item.status !== 'ok').length;
        },
        criticalServices() {
          return this.state.services.slice(0, 4);
        },
        queueRows() {
          return this.tasksSnapshot.map((task) => {
            const activeStage = Array.isArray(task.stages)
              ? task.stages.find((item) => item.cls === 'is-active') || task.stages.find((item) => item.cls === 'is-done')
              : null;
            const pendingDeposits = Array.isArray(task.deposits)
              ? task.deposits.filter((item) => item.status !== 'confirmed' && item.status !== 'skipped').length
              : 0;
            return {
              id: task.id,
              title: task.title,
              kind: task.kind || '任务',
              status: task.status || '等待处理',
              statusType: task.statusType || 'info',
              stage: activeStage ? activeStage.name : '等待处理',
              pendingDeposits,
              lane: pendingDeposits > 0 ? '沉淀通道' : ((task.kind || '').includes('复盘') ? '复盘通道' : '分析通道'),
              updatedAt: task.finishedAt || task.createdAt || '刚刚',
              href: task.id ? `./task.html?taskId=${task.id}` : './task.html',
            };
          });
        },
        pendingDepositCount() {
          return this.queueRows.reduce((sum, row) => sum + row.pendingDeposits, 0);
        },
        runningTaskCount() {
          return this.queueRows.filter((row) => !String(row.status).includes('已沉淀')).length;
        },
        activeAlerts() {
          return this.state.alerts.filter((item) => item.active !== false);
        },
        activeAlertCount() {
          return this.activeAlerts.length;
        },
        stats() {
          return [
            {
              label: '服务健康',
              value: `${this.healthyServiceCount}/${this.state.services.length}`,
              meta: this.degradedServiceCount ? `${this.degradedServiceCount} 个服务处于降级或离线` : '全部关键依赖运行正常',
            },
            {
              label: '任务队列',
              value: `${this.queueRows.length}`,
              meta: `${this.runningTaskCount} 个任务仍在运行链路中`,
            },
            {
              label: '待确认沉淀',
              value: `${this.pendingDepositCount}`,
              meta: '来自任务页的草稿，需要你确认后才能真正入库',
            },
            {
              label: '定时任务',
              value: `${this.state.schedulers.filter((item) => item.enabled).length}/${this.state.schedulers.length}`,
              meta: '启用中的巡检、扫描与同步触发器',
            },
            {
              label: '数据同步',
              value: `${this.state.syncJobs.filter((item) => item.status === 'healthy').length}/${this.state.syncJobs.length}`,
              meta: this.state.syncJobs.some((item) => item.status !== 'healthy') ? '存在降级同步链路' : '所有同步源运行稳定',
            },
          ];
        },
        recentActivities() {
          return this.state.activities.slice(0, 12);
        },
        syncPolicies() {
          return [
            {
              id: 'policy-core-first',
              name: '主数据优先入事实层',
              scope: '对象事实层',
              desc: '财务、行情和持仓这类核心事实优先使用主数据源，不因补充链路失败而阻塞对象页。',
            },
            {
              id: 'policy-side-cache',
              name: '补充链路只写缓存',
              scope: '候选发现 / 时间线',
              desc: '公告、新闻与衍生指标默认先写缓存，确认稳定后再进入对象时间线。',
            },
            {
              id: 'policy-library-confirm',
              name: '研究库只接确认资产',
              scope: '研究库',
              desc: '任务草稿不会通过同步直接进入研究库，必须经人工确认后才允许入库。',
            },
          ];
        },
        modeLabel() {
          if (this.state.mode === 'maintenance') return '维护';
          if (this.state.mode === 'cautious') return '谨慎';
          return '自动';
        },
        modeTone() {
          if (this.state.mode === 'maintenance') return 'maintenance';
          if (this.state.mode === 'cautious') return 'cautious';
          return 'auto';
        },
        modeDescription() {
          if (this.state.mode === 'maintenance') {
            return '系统正在维护窗口内，低优先级任务会被延后，核心链路以稳定为先。';
          }
          if (this.state.mode === 'cautious') {
            return '当前启用谨慎模式，系统会收紧并发、优先保障主数据源与深度分析任务。';
          }
          return '当前处于自动模式，系统会根据队列压力自动降级非核心链路并保留主研究流程。';
        },
      },
      mounted() {
        this.loadState();
        this.applyPaneFromQuery();
        this.refreshFromStorage(false);
      },
      methods: {
        applyPaneFromQuery() {
          const pane = new URLSearchParams(window.location.search).get('pane');
          if (pane && this.navItems.some((item) => item.key === pane)) {
            this.activePane = pane;
          }
        },
        loadState() {
          const defaults = defaultControlState();
          const stored = readJson(PROTOTYPE_KEYS.controlState, null);
          if (!stored) {
            this.state = defaults;
            this.persistState();
            return;
          }
          this.state = {
            ...defaults,
            ...stored,
            services: Array.isArray(stored.services) ? stored.services : defaults.services,
            alerts: Array.isArray(stored.alerts) ? stored.alerts : defaults.alerts,
            activities: Array.isArray(stored.activities) ? stored.activities : defaults.activities,
            automation: Array.isArray(stored.automation) ? stored.automation : defaults.automation,
            schedulers: Array.isArray(stored.schedulers) ? stored.schedulers : defaults.schedulers,
            syncJobs: Array.isArray(stored.syncJobs) ? stored.syncJobs : defaults.syncJobs,
          };
        },
        persistState() {
          writeJson(PROTOTYPE_KEYS.controlState, this.state);
        },
        refreshFromStorage(logAction) {
          const tasks = readJson(PROTOTYPE_KEYS.tasks, []);
          this.tasksSnapshot = Array.isArray(tasks) && tasks.length ? tasks : defaultTasksSnapshot();
          this.syncTaskAlert();
          this.syncWorkerNotice();
          this.persistState();
          if (logAction) {
            this.addActivity('同步跨页状态', `刷新 ${this.queueRows.length} 个任务视图，并识别到 ${this.pendingDepositCount} 条待确认沉淀。`, 'info');
            ElementPlus.ElMessage.success('已同步工作台、任务页和沉淀队列状态');
          }
        },
        syncTaskAlert() {
          const existing = this.state.alerts.find((item) => item.id === 'task-pending');
          if (this.pendingDepositCount > 0) {
            const payload = {
              id: 'task-pending',
              severity: this.pendingDepositCount > 2 ? 'warning' : 'info',
              title: `有 ${this.pendingDepositCount} 条待确认沉淀`,
              body: '任务产出的草稿仍等待你决定是否入库，研究库不会自动接收未确认内容。',
              source: '任务中心',
              time: nowStamp(),
              taskHref: './task.html',
              active: true,
            };
            if (existing) Object.assign(existing, payload);
            else this.state.alerts.unshift(payload);
          } else if (existing) {
            existing.active = false;
            existing.time = nowStamp();
          }
        },
        syncWorkerNotice() {
          const worker = this.state.services.find((item) => item.id === 'worker-pool');
          if (!worker) return;
          worker.lastCheck = nowStamp();
          worker.latency = `${(0.8 + this.runningTaskCount * 0.3 + this.pendingDepositCount * 0.2).toFixed(1)}s`;
          worker.notice = this.pendingDepositCount
            ? `当前有 ${this.runningTaskCount} 个任务在链路中，另有 ${this.pendingDepositCount} 条沉淀等待确认。`
            : `当前有 ${this.runningTaskCount} 个任务在链路中，没有沉淀积压。`;
          worker.recentAction = this.pendingDepositCount ? '沉淀队列仍需要人工确认' : '沉淀队列已清空';
        },
        addActivity(title, body, tone) {
          this.state.activities.unshift({
            id: `evt-${Date.now()}`,
            title,
            body,
            tone: tone || 'info',
            time: nowStamp(),
          });
          this.state.activities = this.state.activities.slice(0, 12);
          this.persistState();
        },
        serviceTagType(status) {
          return status === 'ok' ? 'success' : (status === 'offline' ? 'danger' : 'warning');
        },
        statusLabel(status) {
          return status === 'ok' ? '正常' : (status === 'offline' ? '离线' : '降级');
        },
        activityTagType(tone) {
          return tone === 'success' ? 'success' : (tone === 'warning' ? 'warning' : (tone === 'primary' ? 'primary' : 'info'));
        },
        activityLabel(tone) {
          return tone === 'success' ? '完成' : (tone === 'warning' ? '注意' : (tone === 'primary' ? '系统' : '记录'));
        },
        alertTagType(severity) {
          return severity === 'warning' ? 'warning' : (severity === 'danger' ? 'danger' : 'info');
        },
        alertLabel(severity) {
          return severity === 'warning' ? '警告' : (severity === 'danger' ? '严重' : '提示');
        },
        syncTagType(status) {
          return status === 'healthy' ? 'success' : (status === 'paused' ? 'info' : 'warning');
        },
        syncStatusLabel(status) {
          return status === 'healthy' ? '正常' : (status === 'paused' ? '已暂停' : '降级');
        },
        openServiceDialog(service) {
          this.selectedService = service;
          this.showServiceDialog = true;
        },
        toggleServiceStatus(service) {
          const isRecover = service.status !== 'ok';
          service.status = isRecover ? 'ok' : 'degraded';
          service.lastCheck = nowStamp();
          service.notice = isRecover
            ? '已手动恢复主链路，继续观察下一轮健康检查结果。'
            : '已模拟降级，系统会继续走备用链路，便于验证工作台与任务页是否仍可用。';
          service.recentAction = isRecover ? '人工恢复完成' : '人工触发服务降级';
          if (service.id === 'akshare' && !isRecover) service.latency = '7.2s';
          if (service.id === 'akshare' && isRecover) service.latency = '1.1s';
          if (service.id === 'akshare') {
            const akAlert = this.state.alerts.find((item) => item.id === 'alert-akshare');
            if (akAlert) {
              akAlert.active = !isRecover;
              akAlert.time = nowStamp();
            }
          }
          this.persistState();
          this.addActivity(
            isRecover ? `恢复 ${service.name}` : `${service.name} 进入降级`,
            isRecover ? '主链路已恢复，后续健康检查会继续跟踪。' : '已切换到备用路径，用于验证业务链路是否具备兜底能力。',
            isRecover ? 'success' : 'warning'
          );
          ElementPlus.ElMessage[isRecover ? 'success' : 'warning'](isRecover ? `${service.name} 已恢复` : `${service.name} 已切换为降级状态`);
        },
        runHealthCheck() {
          this.refreshFromStorage(false);
          this.state.services.forEach((service) => {
            service.lastCheck = nowStamp();
            if (service.id === 'akshare') {
              const autoFallback = this.state.automation.find((item) => item.id === 'auto-akshare-fallback');
              if (autoFallback && autoFallback.enabled) {
                service.status = 'degraded';
                service.latency = '6.4s';
                service.notice = '第三方接口仍在限流，但自动降级已生效，主链路继续可用。';
              }
            }
          });
          this.persistState();
          this.addActivity('执行健康检查', `扫描 ${this.state.services.length} 个依赖，当前 ${this.healthyServiceCount} 个正常、${this.degradedServiceCount} 个降级。`, 'primary');
          ElementPlus.ElMessage.success('健康检查已完成');
        },
        acknowledgeAlert(alert) {
          alert.active = false;
          alert.ackedAt = nowStamp();
          this.persistState();
          this.addActivity('确认告警', `${alert.title} 已被人工确认。`, 'info');
          ElementPlus.ElMessage.success('已确认该告警');
        },
        clearResolvedAlerts() {
          this.state.alerts = this.state.alerts.filter((item) => item.active !== false);
          this.persistState();
          ElementPlus.ElMessage.info('已清理已确认告警');
        },
        changeMode(value) {
          if (value === 'maintenance') return;
          this.persistState();
          this.addActivity('切换运行模式', `当前运行模式已切换为${value === 'cautious' ? '谨慎' : '自动'}。`, 'info');
        },
        toggleAutomation(rule) {
          this.persistState();
          this.addActivity(rule.enabled ? `启用 ${rule.name}` : `关闭 ${rule.name}`, rule.desc, rule.enabled ? 'success' : 'warning');
        },
        submitMaintenance() {
          if (!this.maintenanceForm.owner || !this.maintenanceForm.reason || !this.maintenanceForm.endAt) {
            ElementPlus.ElMessage.warning('请完整填写维护窗口信息');
            return;
          }
          this.state.mode = 'maintenance';
          this.state.maintenance = {
            owner: this.maintenanceForm.owner,
            endAt: this.maintenanceForm.endAt,
            reason: this.maintenanceForm.reason,
            drainQueue: this.maintenanceForm.drainQueue,
            startedAt: nowStamp(),
          };
          const existing = this.state.alerts.find((item) => item.id === 'maintenance-window');
          const payload = {
            id: 'maintenance-window',
            severity: 'warning',
            title: '系统进入维护窗口',
            body: this.maintenanceForm.drainQueue ? '低优先级任务将被延后，只保留关键链路继续运行。' : '维护期间维持现有任务，但请谨慎发起新任务。',
            source: `值守人：${this.maintenanceForm.owner}`,
            time: nowStamp(),
            active: true,
          };
          if (existing) Object.assign(existing, payload);
          else this.state.alerts.unshift(payload);
          this.persistState();
          this.addActivity('开启维护窗口', `${this.maintenanceForm.reason} · 截止 ${this.maintenanceForm.endAt}。`, 'warning');
          this.showMaintenanceDialog = false;
          ElementPlus.ElMessage.success('维护窗口已生效');
        },
        endMaintenance() {
          this.state.mode = 'auto';
          this.state.maintenance = null;
          const existing = this.state.alerts.find((item) => item.id === 'maintenance-window');
          if (existing) {
            existing.active = false;
            existing.time = nowStamp();
          }
          this.persistState();
          this.addActivity('结束维护窗口', '系统已回到自动模式，恢复正常任务接入。', 'success');
          ElementPlus.ElMessage.success('已结束维护窗口');
        },
        openSchedulerDialog(job) {
          if (job) {
            this.schedulerForm = {
              id: job.id,
              name: job.name,
              type: job.type,
              schedule: job.schedule,
              priority: job.priority,
              window: job.window,
              conflictPolicy: job.conflictPolicy,
              desc: job.desc,
            };
          } else {
            this.schedulerForm = {
              id: null,
              name: '',
              type: '候选扫描',
              schedule: '',
              priority: 'P1',
              window: '',
              conflictPolicy: '',
              desc: '',
            };
          }
          this.showSchedulerDialog = true;
        },
        submitScheduler() {
          if (!this.schedulerForm.name || !this.schedulerForm.type || !this.schedulerForm.schedule) {
            ElementPlus.ElMessage.warning('请完整填写定时任务名称、类型和执行周期');
            return;
          }
          const payload = {
            id: this.schedulerForm.id || `sched-${Date.now()}`,
            name: this.schedulerForm.name,
            type: this.schedulerForm.type,
            schedule: this.schedulerForm.schedule,
            owner: '系统控制台',
            desc: this.schedulerForm.desc || '通过系统控制台新建的定时任务。',
            enabled: true,
            lastRun: '尚未执行',
            nextRun: '待计算',
            retryPolicy: '失败后 10 分钟重试 1 次',
            priority: this.schedulerForm.priority,
            window: this.schedulerForm.window || '全天',
            conflictPolicy: this.schedulerForm.conflictPolicy || '冲突时顺延到下一空闲窗口',
            note: '新增任务，请在首次执行前确认依赖和时间窗口。',
          };
          const idx = this.state.schedulers.findIndex((item) => item.id === payload.id);
          if (idx >= 0) this.state.schedulers.splice(idx, 1, { ...this.state.schedulers[idx], ...payload });
          else this.state.schedulers.unshift(payload);
          this.persistState();
          this.addActivity(this.schedulerForm.id ? `更新定时任务：${payload.name}` : `新增定时任务：${payload.name}`, `${payload.type} · ${payload.schedule}`, 'success');
          this.showSchedulerDialog = false;
          ElementPlus.ElMessage.success('定时任务已保存');
        },
        toggleScheduler(job) {
          this.persistState();
          this.addActivity(job.enabled ? `启用定时任务：${job.name}` : `暂停定时任务：${job.name}`, `${job.type} · ${job.schedule}`, job.enabled ? 'success' : 'warning');
        },
        runSchedulerNow(job) {
          job.lastRun = nowStamp();
          job.nextRun = '等待下一轮调度';
          this.persistState();
          this.addActivity(`手动执行定时任务：${job.name}`, `已按 ${job.type} 任务手动触发一次运行。`, 'primary');
          ElementPlus.ElMessage.success(`${job.name} 已加入执行队列`);
        },
        openSyncDialog(item) {
          if (item) {
            this.syncForm = {
              id: item.id,
              name: item.name,
              source: item.source,
              target: item.target,
              frequency: item.frequency,
              scope: item.scope,
              delay: item.delay,
              desc: item.desc,
            };
          } else {
            this.syncForm = {
              id: null,
              name: '',
              source: '',
              target: '',
              frequency: '',
              scope: '',
              delay: '',
              desc: '',
            };
          }
          this.showSyncDialog = true;
        },
        submitSyncJob() {
          if (!this.syncForm.name || !this.syncForm.source || !this.syncForm.target || !this.syncForm.frequency) {
            ElementPlus.ElMessage.warning('请完整填写同步名称、来源系统、目标区域和同步频率');
            return;
          }
          const payload = {
            id: this.syncForm.id || `sync-${Date.now()}`,
            name: this.syncForm.name,
            source: this.syncForm.source,
            target: this.syncForm.target,
            status: 'healthy',
            enabled: true,
            frequency: this.syncForm.frequency,
            scope: this.syncForm.scope || '待补充',
            delay: this.syncForm.delay || '待补充',
            lastSync: '尚未执行',
            desc: this.syncForm.desc || '通过系统控制台新建的同步链路。',
            note: '新增同步源，请先观察第一轮执行结果。',
          };
          const idx = this.state.syncJobs.findIndex((item) => item.id === payload.id);
          if (idx >= 0) this.state.syncJobs.splice(idx, 1, { ...this.state.syncJobs[idx], ...payload });
          else this.state.syncJobs.unshift(payload);
          this.persistState();
          this.addActivity(this.syncForm.id ? `更新同步源：${payload.name}` : `新增同步源：${payload.name}`, `${payload.source} → ${payload.target}`, 'success');
          this.showSyncDialog = false;
          ElementPlus.ElMessage.success('同步源已保存');
        },
        runSyncNow(item) {
          item.lastSync = nowStamp();
          item.status = 'healthy';
          item.note = '刚刚完成一次手动同步，建议回到相关业务页核对事实是否更新。';
          this.persistState();
          this.addActivity(`手动同步：${item.name}`, `${item.source} → ${item.target} 已执行一次手动同步。`, 'primary');
          ElementPlus.ElMessage.success(`${item.name} 已开始同步`);
        },
        toggleSyncJob(item) {
          item.enabled = !item.enabled;
          item.status = item.enabled ? 'healthy' : 'paused';
          item.note = item.enabled ? '同步源已恢复，等待下一轮调度。' : '同步源已暂停，不再自动触发。';
          this.persistState();
          this.addActivity(item.enabled ? `启用同步源：${item.name}` : `暂停同步源：${item.name}`, `${item.source} → ${item.target}`, item.enabled ? 'success' : 'warning');
          ElementPlus.ElMessage.info(item.enabled ? `${item.name} 已启用` : `${item.name} 已暂停`);
        },
        exportSnapshot() {
          const payload = {
            exportedAt: nowStamp(),
            mode: this.modeLabel,
            services: this.state.services,
            alerts: this.state.alerts,
            queue: this.queueRows,
            stats: this.stats,
            schedulers: this.state.schedulers,
            syncJobs: this.state.syncJobs,
            activities: this.state.activities,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `system-console-snapshot-${Date.now()}.json`;
          link.click();
          URL.revokeObjectURL(url);
          this.addActivity('导出运行快照', '已导出当前依赖、告警、定时任务与数据同步快照。', 'success');
          ElementPlus.ElMessage.success('运行快照已导出');
        },
        goToHref(href) {
          window.location.href = href;
        },
      },
    });

    app.use(ElementPlus);
    for (const [key, value] of Object.entries(ElementPlusIconsVue)) app.component(key, value);
    registerPrototypeComponents(app);
    app.mount('#app');
  </script>
</body>
</html>
