<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>研究对象 · TradingAgents v4.0</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
  <link rel="stylesheet" href="./assets/theme.css?v=4" />
  <style>
    /* —— 页面级样式：研究对象列表 —— */
    .objects-page .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .objects-page .page-header h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; color: var(--text-primary); }
    .objects-page .page-header .page-subtitle { font-size: 13px; color: var(--text-secondary); }
    .objects-page .header-actions { display: flex; gap: 8px; }

    /* 类型概览条 */
    .type-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
    .type-card {
      background: #fff; border: 1px solid var(--border-light); border-radius: 8px;
      padding: 14px 16px; cursor: pointer; transition: all 0.15s;
      display: flex; flex-direction: column; gap: 6px;
    }
    .type-card:hover { border-color: var(--el-color-primary-light-5); box-shadow: var(--shadow-card-hover); }
    .type-card.is-active { border-color: var(--el-color-primary); background: var(--el-color-primary-light-9); }
    .type-card .tc-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .type-card .tc-label .el-icon { font-size: 14px; color: var(--el-color-primary); }
    .type-card .tc-value { font-size: 22px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .type-card .tc-meta { font-size: 12px; color: var(--text-tertiary); }

    /* 工具栏 */
    .toolbar {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: #fff; border: 1px solid var(--border-light); border-bottom: none;
      border-radius: 8px 8px 0 0;
    }
    .toolbar .toolbar-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .toolbar .toolbar-right { display: flex; align-items: center; gap: 8px; }
    .toolbar .filter-chip { display: inline-flex; align-items: center; gap: 4px; }

    /* 表格容器 */
    .table-wrap { background: #fff; border: 1px solid var(--border-light); border-radius: 0 0 8px 8px; overflow: hidden; }
    .table-wrap .el-table { --el-table-row-hover-bg-color: var(--el-color-primary-light-9); }
    .table-wrap .el-table th.el-table__cell { background: var(--bg-page); font-weight: 500; color: var(--text-secondary); }

    /* 表内自定义元素 */
    .obj-name { display: flex; align-items: center; gap: 10px; }
    .obj-name .obj-code-mark {
      width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
      background: var(--el-color-primary-light-9); color: var(--el-color-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }
    .obj-name .obj-code-mark.is-theme { background: #FEF0E7; color: #E6A23C; }
    .obj-name .obj-code-mark.is-portfolio { background: #F0EBFE; color: #6B48E3; }
    .obj-name .obj-code-mark.is-review { background: #ECF5FF; color: #409EFF; }
    .obj-name .name-block .name { font-size: 14px; font-weight: 500; color: var(--text-primary); line-height: 1.4; }
    .obj-name .name-block .code { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

    .price-cell { font-variant-numeric: tabular-nums; line-height: 1.4; }
    .price-cell .price-num { font-size: 14px; font-weight: 500; }
    .price-cell .price-change { font-size: 12px; }
    .price-cell.up .price-num, .price-cell.up .price-change { color: var(--stock-up); }
    .price-cell.down .price-num, .price-cell.down .price-change { color: var(--stock-down); }

    .pending-cell { display: flex; flex-wrap: wrap; gap: 4px; }
    .pending-cell:empty::before { content: "—"; color: var(--text-tertiary); }

    .change-cell { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .change-cell .change-time { color: var(--text-tertiary); margin-right: 4px; }

    .tag-strip { display: inline-flex; flex-wrap: wrap; gap: 4px; }

    /* 空状态 */
    .empty-hint { padding: 64px 16px; text-align: center; color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div id="app">
    <app-shell active="objects" page-title="研究对象">
      <div class="objects-page">
        <!-- 页面头 -->
        <div class="page-header">
          <div>
            <h1>研究对象</h1>
            <div class="page-subtitle">
              共 <b>{{ totalCount }}</b> 个正在研究的对象 · 本周新增 3 · 待处理事项 8
            </div>
          </div>
          <div class="header-actions">
            <el-button plain>
              <el-icon><Upload /></el-icon>&nbsp;批量导入
            </el-button>
            <el-button type="primary">
              <el-icon><Plus /></el-icon>&nbsp;添加研究对象
            </el-button>
          </div>
        </div>

        <!-- 类型概览（点击切换筛选） -->
        <div class="type-strip">
          <div
            v-for="t in typeCards"
            :key="t.key"
            class="type-card"
            :class="{ 'is-active': activeType === t.key }"
            @click="activeType = t.key"
          >
            <div class="tc-label">
              <el-icon><component :is="t.icon" /></el-icon>{{ t.label }}
            </div>
            <div class="tc-value">{{ t.count }}</div>
            <div class="tc-meta">{{ t.meta }}</div>
          </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
          <div class="toolbar-left">
            <el-input
              v-model="search"
              placeholder="搜索名称、代码、标签…"
              size="default"
              clearable
              style="width: 280px;"
            >
              <template #prefix><el-icon><Search /></el-icon></template>
            </el-input>
            <el-select v-model="filterTag" placeholder="标签" size="default" clearable style="width: 140px;">
              <el-option label="持仓" value="持仓" />
              <el-option label="自选" value="自选" />
              <el-option label="规则命中" value="规则命中" />
              <el-option label="待复盘" value="待复盘" />
            </el-select>
            <el-select v-model="filterPending" placeholder="待处理" size="default" clearable style="width: 140px;">
              <el-option label="有未沉淀" value="deposit" />
              <el-option label="有进行中任务" value="task" />
              <el-option label="有时间线异动" value="change" />
            </el-select>
            <el-select v-model="sortBy" size="default" style="width: 160px;">
              <el-option label="最近变化" value="recent" />
              <el-option label="纳入研究时间" value="added" />
              <el-option label="名称" value="name" />
              <el-option label="待处理项数" value="pending" />
            </el-select>
            <span v-if="selected.length" class="text-sm muted">
              已选择 <b>{{ selected.length }}</b> 项
            </span>
          </div>
          <div class="toolbar-right">
            <el-button v-if="selected.length" plain size="default">
              <el-icon><Operation /></el-icon>&nbsp;批量发起分析
            </el-button>
            <el-button v-if="selected.length" plain size="default">
              <el-icon><FolderAdd /></el-icon>&nbsp;加入组合
            </el-button>
            <el-tooltip content="表格视图"><el-button :type="view==='table'?'primary':''" plain size="default" @click="view='table'"><el-icon><List /></el-icon></el-button></el-tooltip>
            <el-tooltip content="卡片视图"><el-button :type="view==='card'?'primary':''" plain size="default" @click="view='card'"><el-icon><Grid /></el-icon></el-button></el-tooltip>
          </div>
        </div>

        <!-- 表格 -->
        <div class="table-wrap">
          <el-table
            v-if="view === 'table'"
            :data="filtered"
            row-key="id"
            stripe
            @selection-change="rows => selected = rows"
            empty-text="没有匹配的研究对象"
          >
            <el-table-column type="selection" width="44" />
            <el-table-column label="名称" min-width="220">
              <template #default="{ row }">
                <a :href="row.href" class="obj-name" style="text-decoration:none;">
                  <div class="obj-code-mark" :class="codeMarkClass(row)">{{ codeMarkText(row) }}</div>
                  <div class="name-block">
                    <div class="name">{{ row.name }}</div>
                    <div class="code">{{ row.code || row.subtype }}</div>
                  </div>
                </a>
              </template>
            </el-table-column>
            <el-table-column label="类型" width="100">
              <template #default="{ row }">
                <el-tag :type="typeTagType(row.type)" size="small" effect="light">{{ typeLabel(row.type) }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="标签" min-width="200">
              <template #default="{ row }">
                <div class="tag-strip">
                  <span v-for="t in row.tags" :key="t" class="tag-soft" :class="{ 'tag-primary': t === '持仓' }">{{ t }}</span>
                </div>
              </template>
            </el-table-column>
            <el-table-column label="最新价 / 涨跌" width="140" align="right">
              <template #default="{ row }">
                <div v-if="row.price" class="price-cell" :class="row.changeDir">
                  <div class="price-num">{{ row.price }}</div>
                  <div class="price-change">{{ row.change }}</div>
                </div>
                <span v-else class="text-sm muted">—</span>
              </template>
            </el-table-column>
            <el-table-column label="最近变化" min-width="240">
              <template #default="{ row }">
                <div class="change-cell">
                  <span class="change-time">{{ row.lastChangeTime }}</span>{{ row.lastChange }}
                </div>
              </template>
            </el-table-column>
            <el-table-column label="待处理" width="180">
              <template #default="{ row }">
                <div class="pending-cell">
                  <el-tag v-if="row.pendingDeposit" type="warning" size="small" effect="light">待沉淀 {{ row.pendingDeposit }}</el-tag>
                  <el-tag v-if="row.runningTask" type="info" size="small" effect="light">进行中 {{ row.runningTask }}</el-tag>
                  <el-tag v-if="row.alert" type="danger" size="small" effect="light">异动</el-tag>
                </div>
              </template>
            </el-table-column>
            <el-table-column label="纳入研究" width="110">
              <template #default="{ row }">
                <span class="text-sm muted">{{ row.addedAt }}</span>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="120" fixed="right">
              <template #default="{ row }">
                <el-button link type="primary" size="small" @click="openDetail(row)">查看档案</el-button>
                <el-dropdown trigger="click">
                  <el-button link size="small"><el-icon><MoreFilled /></el-icon></el-button>
                  <template #dropdown>
                    <el-dropdown-menu>
                      <el-dropdown-item>发起分析</el-dropdown-item>
                      <el-dropdown-item>记录观点</el-dropdown-item>
                      <el-dropdown-item>创建计划</el-dropdown-item>
                      <el-dropdown-item divided>移出研究</el-dropdown-item>
                    </el-dropdown-menu>
                  </template>
                </el-dropdown>
              </template>
            </el-table-column>
          </el-table>

          <div v-else class="empty-hint">
            卡片视图原型（占位） · 请使用表格视图查看完整数据
          </div>
        </div>

        <!-- 分页 -->
        <div style="display:flex; justify-content: flex-end; margin-top: 16px;">
          <el-pagination
            background
            layout="total, sizes, prev, pager, next, jumper"
            :total="filtered.length"
            :page-sizes="[20, 50, 100]"
            :default-page-size="20"
          />
        </div>
      </div>
    </app-shell>
  </div>

  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="./assets/shared.js?v=7"></script>
  <script>
    const { createApp } = Vue;
    const app = createApp({
      data() {
        return {
          activeType: "all",
          search: "",
          filterTag: "",
          filterPending: "",
          sortBy: "recent",
          view: "table",
          selected: [],
          objects: [
            // 股票
            { id: 1, type: "stock", name: "招商银行", code: "600036.SH", subtype: "A 股 · 银行",
              tags: ["持仓", "高股息", "规则命中：业绩稳定 v3"],
              price: "¥38.42", change: "+1.64%", changeDir: "up",
              lastChangeTime: "12:36", lastChange: "Q1 财报披露：归母净利同比 +7.8%",
              pendingDeposit: 3, runningTask: 0, alert: false,
              addedAt: "2025-08-12", href: "./object-detail.html" },
            { id: 2, type: "stock", name: "宁德时代", code: "300750.SZ", subtype: "A 股 · 电池",
              tags: ["持仓", "电池龙头"],
              price: "¥218.50", change: "+3.21%", changeDir: "up",
              lastChangeTime: "08:15", lastChange: "披露 2026Q1 业绩预告，归母净利同比 +18%",
              pendingDeposit: 1, runningTask: 1, alert: false,
              addedAt: "2025-06-03", href: "./object-detail.html" },
            { id: 3, type: "stock", name: "贵州茅台", code: "600519.SH", subtype: "A 股 · 白酒",
              tags: ["自选", "高分红"],
              price: "¥1582.00", change: "−0.42%", changeDir: "down",
              lastChangeTime: "11:28", lastChange: "管理层调整公告（无重大经营变化）",
              pendingDeposit: 0, runningTask: 0, alert: false,
              addedAt: "2024-11-20", href: "./object-detail.html" },
            { id: 4, type: "stock", name: "中际旭创", code: "300308.SZ", subtype: "A 股 · 光模块",
              tags: ["自选", "AI 算力链", "规则命中：业绩拐点 v2"],
              price: "¥138.42", change: "+3.21%", changeDir: "up",
              lastChangeTime: "今天", lastChange: "Q1 净利环比 +42%，触发「业绩拐点」规则",
              pendingDeposit: 0, runningTask: 0, alert: true,
              addedAt: "2026-04-28", href: "./object-detail.html" },
            { id: 5, type: "stock", name: "比亚迪", code: "002594.SZ", subtype: "A 股 · 整车",
              tags: ["自选", "电池-整车一体化"],
              price: "¥248.20", change: "+0.85%", changeDir: "up",
              lastChangeTime: "12:14", lastChange: "已纳入「宁德 vs 比亚迪 横向对比」任务",
              pendingDeposit: 0, runningTask: 1, alert: false,
              addedAt: "2025-09-05", href: "./object-detail.html" },
            { id: 6, type: "stock", name: "美团-W", code: "03690.HK", subtype: "港股 · 互联网",
              tags: ["自选", "消费复苏"],
              price: "HK$132.00", change: "+1.85%", changeDir: "up",
              lastChangeTime: "11:48", lastChange: "本周外卖单量同比 +9%（主题事件强关联）",
              pendingDeposit: 0, runningTask: 0, alert: false,
              addedAt: "2025-12-18", href: "./object-detail.html" },
            { id: 7, type: "stock", name: "工商银行", code: "601398.SH", subtype: "A 股 · 银行",
              tags: ["自选", "高股息"],
              price: "¥6.18", change: "−0.16%", changeDir: "down",
              lastChangeTime: "昨天", lastChange: "无关键变化",
              pendingDeposit: 0, runningTask: 0, alert: false,
              addedAt: "2025-08-12", href: "./object-detail.html" },
            // ETF
            { id: 8, type: "etf", name: "中证 A50 ETF", code: "563000.SH", subtype: "宽基 ETF",
              tags: ["持仓", "核心配置"],
              price: "¥1.082", change: "+0.74%", changeDir: "up",
              lastChangeTime: "今天", lastChange: "成交量较前日 +35%",
              pendingDeposit: 0, runningTask: 0, alert: false,
              addedAt: "2025-10-08", href: "./object-detail.html" },
            { id: 9, type: "etf", name: "光伏 ETF", code: "515790.SH", subtype: "行业 ETF",
              tags: ["自选", "光伏主线"],
              price: "¥0.815", change: "−1.21%", changeDir: "down",
              lastChangeTime: "2 天前", lastChange: "组合收益走低，建议复盘",
              pendingDeposit: 1, runningTask: 0, alert: false,
              addedAt: "2025-04-22", href: "./object-detail.html" },
            // 主题
            { id: 10, type: "theme", name: "AI 算力链", code: null, subtype: "主题",
              tags: ["规则命中"],
              price: null, change: null, changeDir: null,
              lastChangeTime: "今天", lastChange: "新增 2 只规则命中候选（中际旭创、新易盛）",
              pendingDeposit: 1, runningTask: 0, alert: false,
              addedAt: "2025-11-15", href: "./object-detail.html" },
            { id: 11, type: "theme", name: "消费复苏", code: null, subtype: "主题",
              tags: ["主题"],
              price: null, change: null, changeDir: null,
              lastChangeTime: "本周", lastChange: "外卖、餐饮、免税多数据点同步走强",
              pendingDeposit: 0, runningTask: 0, alert: false,
              addedAt: "2025-12-18", href: "./object-detail.html" },
            // 组合
            { id: 12, type: "portfolio", name: "核心持仓组合", code: null, subtype: "8 只成分",
              tags: ["持仓"],
              price: null, change: "本月 +2.1%", changeDir: "up",
              lastChangeTime: "今天", lastChange: "招行 + 宁德同时贡献正收益",
              pendingDeposit: 0, runningTask: 0, alert: false,
              addedAt: "2025-08-12", href: "./portfolio-detail.html" },
            { id: 13, type: "portfolio", name: "光伏主线组合", code: null, subtype: "5 只成分",
              tags: ["复盘中"],
              price: null, change: "本月 −1.6%", changeDir: "down",
              lastChangeTime: "上周三", lastChange: "已挂起复盘任务 5 天，等你补充假设回顾",
              pendingDeposit: 0, runningTask: 1, alert: false,
              addedAt: "2025-04-22", href: "./portfolio-detail.html" },
            // 复盘对象
            { id: 14, type: "review", name: "光伏中报抢跑判断", code: "REV-2025-08", subtype: "复盘对象",
              tags: ["待复盘"],
              price: null, change: null, changeDir: null,
              lastChangeTime: "5 天前", lastChange: "复盘任务等待第 2 步「假设回顾」",
              pendingDeposit: 0, runningTask: 1, alert: false,
              addedAt: "2025-08-30", href: "./object-detail.html" },
            { id: 15, type: "review", name: "白酒高位减仓决策", code: "REV-2024-11", subtype: "复盘对象",
              tags: ["已复盘"],
              price: null, change: null, changeDir: null,
              lastChangeTime: "2025-01-05", lastChange: "已沉淀为「估值分位减仓」规则",
              pendingDeposit: 0, runningTask: 0, alert: false,
              addedAt: "2024-11-25", href: "./object-detail.html" },
          ],
        };
      },
      computed: {
        totalCount() { return this.objects.length; },
        typeCards() {
          const counts = (k) => k === "all" ? this.objects.length : this.objects.filter(o => o.type === k).length;
          return [
            { key: "all",       label: "全部",     icon: "Menu",         count: counts("all"),       meta: `共 ${counts("all")} 个对象` },
            { key: "stock",     label: "股票",     icon: "DataAnalysis", count: counts("stock"),     meta: "A 股 + 港股 + 美股" },
            { key: "etf",       label: "ETF",     icon: "Grid",          count: counts("etf"),       meta: "宽基 + 行业" },
            { key: "theme",     label: "主题",     icon: "Connection",   count: counts("theme"),     meta: "事件 / 主线" },
            { key: "portfolio", label: "组合",     icon: "Folder",       count: counts("portfolio"), meta: "自定义组合" },
            { key: "review",    label: "复盘对象", icon: "Reading",      count: counts("review"),    meta: "历史决策回顾" },
          ];
        },
        filtered() {
          const kw = this.search.trim().toLowerCase();
          return this.objects.filter(o => {
            if (this.activeType !== "all" && o.type !== this.activeType) return false;
            if (kw && !(o.name.toLowerCase().includes(kw) || (o.code || "").toLowerCase().includes(kw) || o.tags.some(t => t.toLowerCase().includes(kw)))) return false;
            if (this.filterTag && !o.tags.some(t => t.includes(this.filterTag))) return false;
            if (this.filterPending === "deposit" && !o.pendingDeposit) return false;
            if (this.filterPending === "task" && !o.runningTask) return false;
            if (this.filterPending === "change" && !o.alert) return false;
            return true;
          });
        },
      },
      methods: {
        typeLabel(t) { return ({ stock: "股票", etf: "ETF", theme: "主题", portfolio: "组合", review: "复盘" })[t] || t; },
        typeTagType(t) { return ({ stock: "primary", etf: "success", theme: "warning", portfolio: "info", review: "" })[t] || ""; },
        codeMarkText(row) {
          if (row.type === "stock" || row.type === "etf") return (row.code || "").split(".")[0].slice(-4);
          if (row.type === "theme") return "主题";
          if (row.type === "portfolio") return "组合";
          if (row.type === "review") return "复盘";
          return "—";
        },
        codeMarkClass(row) {
          return { "is-theme": row.type === "theme", "is-portfolio": row.type === "portfolio", "is-review": row.type === "review" };
        },
        openDetail(row) { window.location.href = row.href; },
      },
    });
    if (window.registerPrototypeComponents) window.registerPrototypeComponents(app);
    app.use(ElementPlus);
    for (const [k, v] of Object.entries(ElementPlusIconsVue)) app.component(k, v);
    app.mount("#app");
