id: metric.pe_ttm
object_type: metric
name: 滚动市盈率
formula: 市值 / 过去十二个月归母净利润
machine_formula:
  op: divide
  left: financial.market_cap
  right: financial.net_profit_parent_ttm
numerator:
  - financial.market_cap
denominator:
  - financial.net_profit_parent_ttm
unit: x
frequency: ttm
preconditions:
  - financial.net_profit_parent_ttm exists
  - financial.net_profit_parent_ttm > 0
invalid_conditions:
  - financial.net_profit_parent_ttm <= 0
interpretation_guidelines:
  - 需要和同业或自身历史区间比较
  - 需要结合利润质量和增长持续性解读
related_concepts:
  - concept.pe
version: 1.0.0