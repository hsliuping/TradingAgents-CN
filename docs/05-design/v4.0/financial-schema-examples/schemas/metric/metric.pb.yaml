id: metric.pb
object_type: metric
name: 市净率
formula: 市值 / 归母净资产
machine_formula:
  op: divide
  left: financial.market_cap
  right: financial.net_asset_parent
numerator:
  - financial.market_cap
denominator:
  - financial.net_asset_parent
unit: x
frequency: instant
preconditions:
  - financial.net_asset_parent exists
  - financial.net_asset_parent > 0
invalid_conditions:
  - financial.net_asset_parent <= 0
interpretation_guidelines:
  - 应结合 ROE 和资产质量一起看
  - 对银行、保险、券商通常比 PE 更常用
related_concepts:
  - concept.pb
version: 1.0.0