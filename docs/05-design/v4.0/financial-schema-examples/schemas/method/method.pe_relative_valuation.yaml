id: method.pe_relative_valuation
object_type: method
name: PE 相对估值法
family: valuation
objective: 使用 PE 与同业或历史区间比较，评估公司当前盈利口径下的相对估值水平。
required_metrics:
  - metric.pe_ttm
required_fields:
  - financial.net_profit_parent_ttm
  - financial.market_cap
steps:
  - 确认利润口径和 TTM 数据可用
  - 检查公司是否处于正盈利且利润质量可解释
  - 选择同业可比公司或历史估值区间作为基准
  - 比较当前 PE 与基准，给出偏高、合理或偏低判断
  - 说明适用边界和风险点
assumptions:
  - 当前盈利具有一定持续性
  - 可比公司商业模式和盈利质量具有可比性
strengths:
  - 易解释
  - 适合成熟盈利公司
limitations:
  - 对亏损公司无效
  - 对周期高点利润容易失真
  - 不适合银行等以资产负债表驱动的行业作为唯一主方法
common_failure_modes:
  - 用异常利润年份直接估值
  - 未说明可比基准来源
output_contract_ids:
  - contract.valuation.pe_basic
verifier_rule_ids:
  - verifier.valuation.pe_basic
version: 1.0.0