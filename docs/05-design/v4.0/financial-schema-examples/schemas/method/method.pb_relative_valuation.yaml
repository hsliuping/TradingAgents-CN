id: method.pb_relative_valuation
object_type: method
name: PB 相对估值法
family: valuation
objective: 使用 PB 对净资产导向行业进行相对估值判断。
required_metrics:
  - metric.pb
required_fields:
  - financial.net_asset_parent
  - financial.market_cap
steps:
  - 确认净资产口径和最新市值可用
  - 结合行业属性判断 PB 是否为更合适的主方法
  - 对比同业 PB 或历史 PB 区间
  - 结合 ROE 或资产质量解释 PB 高低
  - 输出估值结论和局限说明
assumptions:
  - 账面净资产具有一定解释力
  - 资产质量没有严重扭曲
strengths:
  - 适合银行、保险、券商等行业
  - 对重资产企业有一定解释力
limitations:
  - 不能脱离 ROE 单独解读
  - 对轻资产和无形资产驱动公司解释力有限
common_failure_modes:
  - 不结合盈利能力解释 PB
  - 忽略资产质量风险
output_contract_ids:
  - contract.valuation.pb_basic
verifier_rule_ids:
  - verifier.valuation.pb_basic
version: 1.0.0