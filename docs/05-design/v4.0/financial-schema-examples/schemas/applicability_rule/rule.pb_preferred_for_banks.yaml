id: rule.pb_preferred_for_banks
object_type: applicability_rule
target_type: method
target_id: method.pb_relative_valuation
rule_kind: preferred
condition_expr:
  op: industry_in
  field: security.industry_level1
  value:
    - 银行
    - 保险
    - 证券
human_description: 对银行、保险、券商类公司，PB 通常比 PE 更适合作为主估值方法。
severity: warning
rationale: 金融行业盈利口径和杠杆特征使得账面净资产与 ROE 组合更具解释力。
examples:
  - 银行股估值优先引用 PB 和 ROE
exceptions:
  - 特殊转型期个股可补充其他方法，但仍需说明 PB 口径
version: 1.0.0