id: rule.peg_requires_meaningful_growth
object_type: applicability_rule
target_type: method
target_id: method.peg_growth_valuation
rule_kind: required
condition_expr:
  op: all_of
  conditions:
    - op: field_gt
      field: financial.earnings_growth_rate_pct
      value: 0
    - op: field_exists
      field: financial.earnings_growth_rate_pct
human_description: 使用 PEG 时，增长率必须存在且为正，并能够解释其来源和持续性。
severity: error
rationale: 无有效增长率时，PEG 失去核心含义。
examples:
  - 负增长或不可解释增长不应直接使用 PEG 给出低估结论
exceptions: []
version: 1.0.0