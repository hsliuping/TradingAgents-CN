id: concept.pe
object_type: concept
name: 市盈率
aliases:
  - PE
  - 市盈率
  - Price to Earnings
category: valuation_metric
summary: 以价格相对于盈利水平衡量估值高低的核心指标。
definition: >-
  市盈率通常表示公司当前股价或市值相对于盈利水平的倍数。
  常见口径包括静态 PE 和滚动 PE。对于正盈利公司，PE 可用于比较同业相对估值。
interpretation: >-
  一般而言，PE 越高表示市场给予更高成长预期或更高估值溢价，PE 越低表示估值相对便宜，
  但必须结合行业、利润质量、增长持续性和周期位置共同判断。
common_misunderstandings:
  - PE 低就一定低估
  - 所有行业都适合用 PE 做主估值方法
  - 亏损企业也可以直接比较 PE
