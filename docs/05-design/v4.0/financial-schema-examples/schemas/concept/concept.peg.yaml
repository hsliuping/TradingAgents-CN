id: concept.peg
object_type: concept
name: 市盈增长比
aliases:
  - PEG
  - 市盈增长比
  - Price Earnings to Growth
category: valuation_metric
summary: 将 PE 与盈利增长率结合，用于评估成长股估值是否匹配增长。
definition: >-
  PEG 常定义为 PE 与盈利增长率的比值，用于衡量估值倍数是否与增长预期大致匹配。
interpretation: >-
  PEG 较低通常被理解为估值相对增长更便宜，但前提是增长率真实、稳定且有持续性。
  对于周期波动大、一次性利润影响强或增长不可持续的公司，PEG 解释力较弱。
common_misunderstandings:
  - PEG 小于 1 就一定低估
  - 任何增长率都可以直接拿来算 PEG
  - 周期股和强波动利润公司同样适合用 PEG
related_concepts:
  - concept.pe
tags:
