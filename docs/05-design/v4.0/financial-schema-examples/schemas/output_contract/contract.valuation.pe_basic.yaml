id: contract.valuation.pe_basic
object_type: output_contract
name: PE 估值基础输出契约
scenario: valuation_skill
required_fields:
  - field_name: method_name
    field_type: string
    description: 使用的方法名称
    nullable: false
    source_requirement: must_state_method
  - field_name: metric_value
    field_type: number
    description: 当前 PE 指标值
    nullable: false
    source_requirement: from_metric_or_calculation
  - field_name: benchmark_basis
    field_type: string
    description: 比较基准，如同业或历史区间
    nullable: false
    source_requirement: must_state_basis
  - field_name: applicability_check
    field_type: object
    description: 前置条件是否满足
    nullable: false
    source_requirement: must_state_applicability
  - field_name: conclusion
    field_type: string
    description: 估值结论
    nullable: false
    source_requirement: must_state_conclusion
optional_fields:
  - field_name: risk_notes
    field_type: array[string]
    description: 方法局限和风险提示
  - field_name: supporting_metrics
    field_type: object
    description: 辅助指标，如增长率、ROE 等
narrative_requirements:
  - 必须说明 PE 口径
  - 必须说明比较基准
  - 必须说明适用边界
prohibited_patterns:
  - 在盈利为负时直接给出 PE 高低结论
example_payload:
  method_name: PE 相对估值法
  metric_value: 18.5
  benchmark_basis: 相比同业 22 至 28 倍区间偏低
  applicability_check:
    passed: true
    notes:
      - 归母净利润 TTM 为正
  conclusion: 当前估值低于可比公司均值，但仍需结合增长持续性判断。
version: 1.0.0