id: contract.valuation.peg_basic
object_type: output_contract
name: PEG 估值基础输出契约
scenario: valuation_skill
required_fields:
  - field_name: method_name
    field_type: string
    description: 使用的方法名称
    nullable: false
    source_requirement: must_state_method
  - field_name: metric_value
    field_type: number
    description: 当前 PEG 值
    nullable: false
    source_requirement: from_metric_or_calculation
  - field_name: growth_basis
    field_type: string
    description: 增长率来源和时间口径
    nullable: false
    source_requirement: must_state_growth_basis
  - field_name: sustainability_assessment
    field_type: string
    description: 对增长持续性的判断
    nullable: false
    source_requirement: must_state_growth_quality
  - field_name: conclusion
    field_type: string
    description: 估值结论
    nullable: false
    source_requirement: must_state_conclusion
optional_fields:
  - field_name: risk_notes
    field_type: array[string]
    description: 成长不确定性风险
narrative_requirements:
  - 必须说明增长率口径
  - 必须说明增长是否可持续
prohibited_patterns:
  - 未说明增长来源就直接给出 PEG 低估结论
example_payload:
  method_name: PEG 成长估值法
  metric_value: 0.88
  growth_basis: 使用未来一年一致预期净利润增长率 22%
  sustainability_assessment: 当前增长来自主营业务扩张，仍需警惕高基数影响。
  conclusion: 若增长兑现，当前估值与成长性相对匹配。
version: 1.0.0